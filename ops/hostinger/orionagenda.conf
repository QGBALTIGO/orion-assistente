# Dedicated Orion ingress. API traffic crosses the authenticated SSH tunnel;
# only its reverse listener is addressed here, on server loopback.
map $http_upgrade $orionagenda_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name orionagenda.pro www.orionagenda.pro;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/orionagenda-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://orionagenda.pro$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.orionagenda.pro;
    ssl_certificate /etc/letsencrypt/live/orionagenda-ingress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionagenda-ingress/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log off;
    error_log /dev/null crit;
    return 308 https://orionagenda.pro$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orionagenda.pro;
    ssl_certificate /etc/letsencrypt/live/orionagenda-ingress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionagenda-ingress/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16m;

    # Narrow authenticated Chisel transport to the existing SSH daemon.
    # Chisel authentication is inside its SSH protocol; HTTP credentials and
    # forwarding metadata are never passed to this control endpoint.
    location = /_orion-origin-https {
        proxy_pass http://127.0.0.1:18444;
        proxy_http_version 1.1;
        proxy_set_header Host orionagenda.pro;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orionagenda_connection_upgrade;
        proxy_set_header Authorization '';
        proxy_set_header Proxy-Authorization '';
        proxy_set_header Cookie '';
        proxy_set_header Forwarded '';
        proxy_set_header X-Forwarded-Host '';
        proxy_set_header X-Forwarded-Proto '';
        proxy_set_header X-Forwarded-Port '';
        proxy_set_header X-Forwarded-For '';
        proxy_set_header X-Real-IP '';
        proxy_set_header X-Orion-Ingress-Token '';
        proxy_set_header X-Orion-Client-IP '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location ^~ /internal/ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location / {
        proxy_pass http://127.0.0.1:18445;
        proxy_http_version 1.1;
        proxy_set_header Host orionagenda.pro;
        # Replace, rather than append, every untrusted forwarding value.
        # realip_remote_addr retains the original connection peer even when
        # another vhost's real-IP settings exist in the shared HTTP context.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-Host '';
        proxy_set_header Forwarded '';
        proxy_set_header X-Orion-Ingress-Token '';
        proxy_set_header X-Orion-Client-IP '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orionagenda_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        # A failed request is never automatically replayed against the API.
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
