name: Orion - preparo isolado da correção de tabelas
on:
  push:
    branches: [codex/fix-mobile-table-actions-20261023]
    paths: [.github/workflows/orion-table-action-fix-once.yml]
permissions:
  contents: write
concurrency:
  group: orion-table-action-fix-once
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'QGBALTIGO/orion-assistente'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-mobile-table-actions-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar apenas ferramentas de teste
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          python -m pip install playwright
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser" ]; then
            echo "ORION_TEST_BROWSER=$browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Demonstrar a quebra no CSS original
        run: python ui-tests/table-action-layout.py --expect-broken
      - name: Aplicar somente a regra de largura das ações
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('app/static/orion-suite.css')
          assert subprocess.check_output(['git','rev-parse','HEAD:app/static/orion-suite.css'],text=True).strip() == '85f5336a0ce04dd6748c86be55ad38ae35a3d152', 'A folha mudou; revisar antes de reaplicar.'
          css = path.read_text(encoding='utf-8')
          anchor = '.os-table .os-table-actions{display:flex;gap:3px;justify-content:flex-end}\n'
          assert css.count(anchor) == 1, 'A regra esperada não é única.'
          fix = '''/* Table actions retain their label and icon width instead of collapsing on mobile.
           * Keep wrapping available for buttons outside horizontally scrollable tables. */
          .os-table .os-button{width:max-content;min-width:max-content;max-width:none;flex:0 0 auto;white-space:nowrap;overflow-wrap:normal;word-break:normal}
          @media(pointer:coarse){.os-table .os-button{min-height:44px}}
          '''
          path.write_text(css.replace(anchor, anchor + fix), encoding='utf-8')
          PY
          git diff --check
      - name: Validar layout com o CSS completo e dados sintéticos
        run: python ui-tests/table-action-layout.py
      - name: Executar testes DOM existentes e regressão
        run: npm test --prefix ui-tests
      - name: Guardar medidas e capturas sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-action-layout
          path: artifacts/table-actions/
          retention-days: 7
      - name: Registrar resultado apenas nesta ramificação
        run: |
          test "$GITHUB_REF_NAME" = 'codex/fix-mobile-table-actions-20261023'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/orion-table-action-fix-once.yml
          git add app/static/orion-suite.css ui-tests/table-action-layout.py ui-tests/table-action-sizing.test.mjs
          git commit -m 'Corrige ações comprimidas nas tabelas do Orion no celular' -m 'Mantém o texto e o ícone em uma linha, preserva rolagem local e garante 44px de toque em dispositivos touch. Sem alterações em APIs, cálculos ou pagamentos. Validação com CSS completo e testes DOM; fluxo temporário removido.'
          git push origin HEAD:refs/heads/codex/fix-mobile-table-actions-20261023
