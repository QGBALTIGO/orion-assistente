name: Orion - Correção de links de ofertas
on:
  push:
    branches: ['codex/afiliados-shortlinks-20261125*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      API_BASE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:3d1bdbf9f501f3797fa684a14e867ceb2d8adf42c43d01b6bd2299e450a8c8f5
      API_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:affiliate-shortlinks-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar extração, rascunhos e recuperação de falhas
        run: |
          python -m pip install -r affiliate_pilot/requirements.txt pytest pytest-asyncio
          PYTHONPATH=. python -m pytest -q affiliate_pilot/tests
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --check app/static/orion-suite.js
          node --input-type=module --check < app/static/orion-affiliate-workspace.js
          node --test --test-reporter=spec ui-tests/affiliate-offers.test.mjs ui-tests/affiliate-dashboard.test.mjs ui-tests/affiliate-dashboard-updates.test.mjs
      - name: Conferir a interface em telas pequenas e grandes
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
          python ui-tests/affiliate-offers-layout.py --widths 320 430 1280
          python ui-tests/affiliate-offers-layout.py --engine webkit --widths 320 430 --themes dark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affiliate-shortlinks-browser
          path: artifacts/affiliate-offers/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir a base publicada
        run: |
          docker run --rm --entrypoint python "$API_BASE" -c '
          import hashlib
          from pathlib import Path
          expected = {
            "orion-suite.js": "c3391d45b0a0f8e1db0114639ca2b75fbf0820997e3d4a802a5be4a9587801dc",
            "orion-affiliate-workspace.js": "571a7781ba206b2cf0400850550dd0d0428b9524b98c45dedac7dfc97c8f30dd",
            "orion-affiliate-workspace.css": "be417ddc5022f2b9246bf1478038a73bc5bff46b84c1a77ab94c1aacdb2b584f",
          }
          for name, digest in expected.items():
            assert hashlib.sha256(Path("app/static", name).read_bytes()).hexdigest() == digest, name
          print("Base de produção conferida.")
          '
      - name: Construir e conferir a atualização da interface
        run: |
          docker build -f deploy/Dockerfile.affiliate-shortlinks --build-arg BASE_IMAGE="$API_BASE" --build-arg ORION_RELEASE="$GITHUB_SHA" -t "$API_IMAGE" .
          docker run --rm --entrypoint python -v "$GITHUB_WORKSPACE/app/static:/review:ro" "$API_IMAGE" -c '
          from pathlib import Path
          for name in ("orion-suite.js", "orion-affiliate-workspace.js", "orion-affiliate-workspace.css"):
            assert Path("app/static", name).read_bytes() == Path("/review", name).read_bytes(), name
          print("Imagem corresponde ao código validado.")
          '
          docker push "$API_IMAGE"
          docker image inspect "$API_IMAGE" --format '{{index .RepoDigests 0}}' > affiliate-shortlinks-api-image.txt
          cat affiliate-shortlinks-api-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-shortlinks-image
          path: affiliate-shortlinks-api-image.txt
