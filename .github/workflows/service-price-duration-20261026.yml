name: Orion - duracao e mascara de preco (iPhone)
on:
  pull_request:
    branches: [main]
    paths:
      - "app/static/orion-suite.js"
      - "app/static/orion-suite.css"
      - "ui-tests/service-duration-money-mask.test.mjs"
      - "tests/e2e/browser_service_editor_price.py"
      - "scripts/prepare_vercel_orion.py"
      - ".github/workflows/service-price-duration-20261026.yml"

permissions:
  contents: read

jobs:
  money-mask-dom:
    name: Atalhos, moeda brasileira e integridade dos formularios
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias travadas da interface
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Testar mascara de reais e servicos relacionados
        run: |
          node --check app/static/orion-suite.js
          node --test \
            ui-tests/service-duration-money-mask.test.mjs \
            ui-tests/services-compact.test.mjs \
            ui-tests/package-variable-combo.test.mjs \
            ui-tests/agenda-lifecycle.test.mjs

  mobile-keyboard:
    name: Teclado e layout real no WebKit e Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegadores isolados
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Testar digitar, apagar, colar, centavos e salvar valores
        run: python -m pytest -q -ra tests/e2e/browser_service_editor_price.py

  vercel-contract:
    name: Validador do arquivo JS do painel
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias travadas e testes de integridade
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pytest -q -ra tests/test_vercel_orion_bundle.py tests/test_vercel_orion_routes.py
