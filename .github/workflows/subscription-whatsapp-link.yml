name: Orion - link e QR WhatsApp (etapa 19)
on:
  pull_request:
    paths:
      - 'app/subscription_whatsapp_link*.py'
      - 'app/static/orion-subscription-whatsapp-link.js'
      - 'tests/unit/test_subscription_whatsapp_link.py'
      - 'ui-tests/subscription-whatsapp-link.test.mjs'
      - 'app/plan_catalog.py'
      - 'app/workspace_policy.py'
      - 'app/plan_routing.py'
      - 'app/main.py'
      - 'app/static/orion-suite.js'
      - 'app/static/panel.html'
      - '.github/workflows/subscription-whatsapp-link.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  META_LIVE_SEND: '0'
  QR_CHANNELS_ENABLED: '0'
  INBOX_SEND_ENABLED: '0'
  MARKETING_EXECUTION_ENABLED: '0'
  PYTHONUTF8: '1'
jobs:
  api-and-local-qr:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -c requirements.lock '.[test]'
      - run: python -m compileall -q app/subscription_whatsapp_link.py app/subscription_whatsapp_link_schemas.py app/plan_routing.py
      - name: Strict owner, link URL and PNG/QR validations
        run: python -m pytest -q tests/unit/test_subscription_whatsapp_link.py
  orion-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - run: node --check app/static/orion-subscription-whatsapp-link.js
      - name: Synthetic DOM no-send tests
        run: node --test ui-tests/subscription-whatsapp-link.test.mjs
