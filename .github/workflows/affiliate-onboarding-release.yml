name: Orion - conexão WhatsApp
on:
  push:
    branches: [codex/orion-afiliados-onboarding-20261125]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:1cf9d43f482740519774cb3bb6b72f06dcf7f44f042a02a11f9bbe0a36f955dd
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:whatsapp-connection-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar conexão, permissões e nichos
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=dot ui-tests/channels.test.mjs ui-tests/channels-pairing.test.mjs ui-tests/subscription-devices.test.mjs ui-tests/subscription-connection-health.test.mjs ui-tests/mobile-atendimento.test.mjs ui-tests/fields-auth.test.mjs ui-tests/fields-onboarding-channels.test.mjs ui-tests/onboarding-affiliates.test.mjs ui-tests/barbershop-app-layout.test.mjs ui-tests/subscription-workspace.test.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir o código-base da imagem ativa
        run: |
          docker run --rm --entrypoint python "$BASE_IMAGE" -c '
          import hashlib
          from pathlib import Path
          expected = {
              "app/static/orion-connect.js": "1d1e646a5419b32095a58a3d5af87715962146fa",
              "app/static/orion-channels.js": "c3f7a4b74cdd0865e5f04291bbb62951bbf38d79",
              "app/static/orion-subscription-devices.js": "9195d7a4ba8a7291b1e6ceeb122b8838f9e5ec57",
              "app/static/orion-channels.css": "54faa7b1525ec58292f2f2e11de634577b3f401b",
              "app/static/panel.html": "e5696136f354584f84499ad834caf2f82cdbeff6",
          }
          for name, digest in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(b"blob %d" % len(data) + bytes(1) + data).hexdigest() == digest, name
          '
      - name: Construir e verificar a API
        run: |
          docker build -f deploy/Dockerfile.affiliate-onboarding --build-arg ORION_RELEASE="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c '
          from app.main import app
          from pathlib import Path
          from app.workspace_policy import workspace_profile
          assert workspace_profile("afiliados") == "affiliate"
          assert "/api/v1/afiliados/{tenant_id}" in app.openapi()["paths"]
          assert "os-connect-steps" in Path("app/static/orion-connect.js").read_text()
          '
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee affiliate-onboarding-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-onboarding-image
          path: affiliate-onboarding-image.txt
