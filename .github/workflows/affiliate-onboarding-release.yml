name: Orion Afiliados - configuração inicial
on:
  push:
    branches: [codex/orion-afiliados-onboarding-20261125]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:1b09ad0caa4015565558ed110081f31a45c0d93657eadcf25a80d7c47086c0f2
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:afiliados-onboarding-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar a criação de empresas e os nichos existentes
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=dot ui-tests/onboarding-affiliates.test.mjs ui-tests/onboarding-subscription-niche.test.mjs ui-tests/onboarding-entry.test.mjs ui-tests/onboarding-save.test.mjs ui-tests/subscription-workspace.test.mjs ui-tests/barbershop-app-layout.test.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir o código-base da imagem ativa
        run: |
          docker run --rm --entrypoint python "$BASE_IMAGE" -c '
          import hashlib
          from pathlib import Path
          expected = {
              "app/affiliate_workspace.py": "465780743ad435e151eb81aab5a2003af9eaca16",
              "app/static/orion-onboarding.js": "b6ddcf02ed50f4506350967f7c5db057bc46e622",
              "app/static/orion-suite.js": "4dd4f1460d39f75bac46d1915e031da660006306",
              "app/static/panel.html": "e843df48af0248575279b518614ef8db36eab714",
          }
          for name, digest in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(b"blob %d" % len(data) + bytes(1) + data).hexdigest() == digest, name
          '
      - name: Construir e verificar a API
        run: |
          docker build -f deploy/Dockerfile.affiliate-onboarding --build-arg ORION_RELEASE="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c '
          from app.onboarding_schemas import CreateBusiness
          from app.main import app
          from pathlib import Path
          from app.workspace_policy import workspace_profile
          assert workspace_profile("afiliados") == "affiliate"
          assert "/api/v1/afiliados/{tenant_id}" in app.openapi()["paths"]
          assert Path("app/static/orion-affiliate-embed.js").is_file()
          CreateBusiness(name="Afiliados", timezone="America/Cuiaba", niche="afiliados",
                         activity="products", affiliate_activity="offers", idempotency_key="synthetic-test")
          '
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee affiliate-onboarding-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-onboarding-image
          path: affiliate-onboarding-image.txt
