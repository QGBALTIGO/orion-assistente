name: Orion - espaco do menu de assinaturas
on:
  pull_request:
    paths:
      - 'app/static/orion-suite.js'
      - 'app/static/orion-suite.css'
      - 'app/static/panel.html'
      - 'tests/e2e/browser_subscription_sidebar_spacing.py'
      - 'tests/e2e/browser_subscription_workspace.py'
      - 'ui-tests/subscription-sidebar-spacing.test.mjs'
      - '.github/workflows/subscription-sidebar-spacing.yml'
  push:
    branches: [fix/subscription-sidebar-spacing-20261104]
    paths: ['.github/workflows/subscription-sidebar-spacing.yml']
permissions:
  contents: read
concurrency:
  group: sidebar-spacing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      INBOX_SEND_ENABLED: '0'
      MARKETING_EXECUTION_ENABLED: '0'
      CAKTO_BILLING_LIVE_ENABLED: '0'
      ORION_DIRECT_PAYMENTS_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias fixadas e navegadores
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Perfil, troca de conta e regressao do menu
        run: |
          node --check app/static/orion-suite.js
          node --test ui-tests/subscription-sidebar-spacing.test.mjs ui-tests/subscription-workspace.test.mjs ui-tests/single-business-context.test.mjs
      - name: Geometria e fluxos - celular, tablet, desktop e dois temas
        run: python -m pytest -q -ra tests/e2e/browser_subscription_sidebar_spacing.py tests/e2e/browser_subscription_workspace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-sidebar-spacing-layout
          path: |
            test-artifacts/subscription-sidebar-spacing/
            test-artifacts/subscription-workspace/
          retention-days: 7
          if-no-files-found: warn
