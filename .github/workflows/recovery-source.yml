name: Recuperação de código para correção isolada
on:
  push:
    branches: [fix/login-agenda-whatsapp-recovery-20261019]
    paths: [.github/workflows/recovery-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exportar somente arquivos versionados
        run: git archive --format=tar.gz --output=orion-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: orion-recovery-source
          path: orion-source.tar.gz
          retention-days: 1
          if-no-files-found: error
