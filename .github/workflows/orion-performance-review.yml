name: Orion - Revisão do desempenho
on:
  push:
    branches: [codex/orion-performance-review-20261115, security/prelaunch-hardening-20261030]
    paths:
      - app/static/orion-suite.js
      - app/static/orion-suite.css
      - ui-tests/performance-charts.test.mjs
      - tests/e2e/test_performance_history_goals.py
      - tests/e2e/fixtures/performance_history_goals.js
      - deploy/Dockerfile.performance
      - .github/workflows/orion-performance-review.yml
  pull_request:
    branches: [security/prelaunch-hardening-20261030]
    paths:
      - app/static/orion-suite.js
      - app/static/orion-suite.css
      - ui-tests/performance-charts.test.mjs
      - tests/e2e/test_performance_history_goals.py
      - tests/e2e/fixtures/performance_history_goals.js
      - deploy/Dockerfile.performance
      - .github/workflows/orion-performance-review.yml
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Gráficos, filtros, planos, metas, histórico e financeiro
        run: >-
          node --test ui-tests/performance-charts.test.mjs
          ui-tests/performance-history-goals.test.mjs ui-tests/dashboard-finance-goals.test.mjs
          ui-tests/plan-permissions.test.mjs ui-tests/orion-plans.test.mjs
          ui-tests/orion-finance-mobile.test.mjs ui-tests/dashboard-navigation.test.mjs
          ui-tests/orion-suite.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/e2e/requirements.txt pytest
      - name: Instalar navegador e dependências
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Conferir gráficos e fluxos em celular, tablet e computador
        run: python -m pytest -q -o addopts='' tests/e2e/test_performance_history_goals.py -k ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.browser }}
          path: test-artifacts/performance-history-goals/
          if-no-files-found: warn
          retention-days: 7
  image:
    needs: [dom, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/orion-performance-review-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile.performance
          push: true
          tags: ghcr.io/qgbaltigo/orion-assistente-api:performance-${{ github.sha }}
          build-args: ORION_RELEASE_SHA=${{ github.sha }}
      - name: Registrar imagem imutável
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python -c 'import json,os; json.dump({"commit":os.environ["GITHUB_SHA"],"image":"ghcr.io/qgbaltigo/orion-assistente-api@"+os.environ["IMAGE_DIGEST"]},open("performance-release.json","w"))'
      - uses: actions/upload-artifact@v4
        with:
          name: performance-release
          path: performance-release.json
          retention-days: 7
