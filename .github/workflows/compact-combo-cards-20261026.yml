name: Orion - cards compactos de combos (mobile e desktop)
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-suite.js'
      - 'app/static/orion-suite.css'
      - 'ui-tests/package-cards-compact.test.mjs'
      - 'tests/e2e/browser_package_cards_compact.py'
      - 'scripts/prepare_vercel_orion.py'
      - '.github/workflows/compact-combo-cards-20261026.yml'

permissions:
  contents: read

jobs:
  combo-layout:
    name: Contrato visual e fluxos de edição de combos
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated UI dependencies
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Compare regular and combo card structure; regressions
        run: |
          node --check app/static/orion-suite.js
          node --test \
            ui-tests/package-cards-compact.test.mjs \
            ui-tests/services-compact.test.mjs \
            ui-tests/package-variable-combo.test.mjs \
            ui-tests/service-duration-money-mask.test.mjs

  combo-browser:
    name: Validate real rendering on iPhone and desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Check card geometry, clip, colors and editor
        run: python -m pytest -q -ra tests/e2e/browser_package_cards_compact.py

  vercel-contract:
    name: Validate Orion suite fingerprint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: |
          python -m pip install -c requirements.lock '.[test]'
      - name: Ensure only approved suite sources are bundled
        run: python -m pytest -q -ra tests/test_vercel_orion_bundle.py tests/test_vercel_orion_routes.py
