name: Orion - Tela de carregamento unificada
on:
  pull_request:
    paths:
      - 'app/static/panel.html'
      - 'ui-tests/session-boot-visual.test.mjs'
      - 'tests/e2e/test_session_boot_responsive.py'
      - '.github/workflows/session-boot-visual.yml'
  push:
    branches: [security/prelaunch-hardening-20261030]
    paths:
      - 'app/static/panel.html'
      - 'ui-tests/session-boot-visual.test.mjs'
      - 'tests/e2e/test_session_boot_responsive.py'
      - '.github/workflows/session-boot-visual.yml'
permissions:
  contents: read
jobs:
  session-dom:
    name: Boot, sessão e recuperação no DOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de teste
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar sessão, tela única e erro recuperável
        run: node --test ui-tests/session-boot-visual.test.mjs ui-tests/session-bootstrap.test.mjs
  boot-browser:
    name: Layout celular, tablet e desktop - ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador e dependências
        run: |
          python -m pip install -c requirements.lock -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Layout real e modo claro escuro sem sessão
        run: python -m pytest -q -ra tests/e2e/test_session_boot_responsive.py -k ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-startup-${{ matrix.browser }}
          path: test-results/orion-boot/
          if-no-files-found: warn
          retention-days: 5
