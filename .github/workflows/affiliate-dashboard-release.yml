name: Orion - Dashboard de Afiliados
on:
  push:
    branches: [codex/afiliados-dashboard-performance-20261125, codex/afiliados-dashboard-interacoes-20261125]
    paths:
      - affiliate_pilot/**
      - app/affiliate_analytics.py
      - app/affiliate_workspace.py
      - app/static/orion-affiliate-workspace.js
      - app/static/orion-affiliate-workspace.css
      - app/static/orion-suite.js
      - tests/unit/test_affiliate_analytics*.py
      - ui-tests/affiliate-dashboard*
      - ui-tests/onboarding-affiliates.test.mjs
      - ui-tests/drawer-focus.test.mjs
      - deploy/Dockerfile.affiliate-dashboard
      - .github/workflows/affiliate-dashboard-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:8ed93e4c8293f24c0c24384787e7742b75fe49fe8537af4a09d6174ae7cfcc11
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:affiliate-dashboard-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar dados, autorização e interface
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/unit/test_affiliate_analytics.py tests/unit/test_affiliate_analytics_api.py
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --check app/static/orion-suite.js
          node --input-type=module --check < app/static/orion-affiliate-workspace.js
          node --test --test-reporter=dot ui-tests/affiliate-dashboard.test.mjs ui-tests/affiliate-dashboard-updates.test.mjs ui-tests/drawer-focus.test.mjs ui-tests/dashboard-navigation.test.mjs ui-tests/home-admin-preview.test.mjs ui-tests/subscription-workspace.test.mjs ui-tests/subscription-app-layout.test.mjs ui-tests/barbershop-app-layout.test.mjs ui-tests/dental-workspace.test.mjs ui-tests/onboarding-affiliates.test.mjs
      - name: Verificar o serviço de relatórios com as dependências da VPS
        run: |
          python -m venv /tmp/orion-affiliate-pilot-tests
          /tmp/orion-affiliate-pilot-tests/bin/pip install -r affiliate_pilot/requirements.txt pytest pytest-asyncio
          PYTHONPATH=. /tmp/orion-affiliate-pilot-tests/bin/python -m pytest -q affiliate_pilot/tests
      - name: Verificar o layout responsivo em navegador isolado
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
          python ui-tests/affiliate-dashboard-layout.py
          python ui-tests/affiliate-dashboard-layout.py --engine webkit --widths 320 430 --themes dark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affiliate-dashboard-layout
          path: artifacts/affiliate-dashboard/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir os arquivos da base publicada
        run: |
          docker run --rm --entrypoint python "$BASE_IMAGE" -c '
          import hashlib
          from pathlib import Path
          expected = {
              "app/static/orion-suite.js": "5cc47c1f036ecbb90b71ea131a83774db9f899fb28549f974a5e878d0befb527",
              "app/affiliate_analytics.py": "c110ae97566c2715389bf677da93f7edeecefaae01cac790197cdd80d2714d4a",
              "app/affiliate_workspace.py": "66ff641c3777d162cbad7946415f767415e64d9ebc600f0aa916e6ec1e7ac663",
              "app/static/orion-affiliate-workspace.js": "c8ca79333c88a2c64de2f6788628c0dc64382b51c45b0e22f38981405001baa0",
              "app/static/orion-affiliate-workspace.css": "6fb263fbd1cba6b3dda426191aad038e37fea765fc584da18926d71e9a5460f8",
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          print("A base corresponde à versão de produção revisada.")
          '
      - name: Construir e conferir o Dashboard
        run: |
          docker build -f deploy/Dockerfile.affiliate-dashboard --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg ORION_RELEASE="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python -v "$GITHUB_WORKSPACE/app:/review:ro" "$IMAGE" -c '
          from pathlib import Path
          for name in ("affiliate_workspace.py", "affiliate_analytics.py", "static/orion-affiliate-workspace.js", "static/orion-affiliate-workspace.css", "static/orion-suite.js"):
              assert Path("app", name).read_bytes() == Path("/review", name).read_bytes(), name
          from app.affiliate_workspace import router
          assert any(route.path.endswith("/api/analytics") for route in router.routes)
          print("A imagem contém exatamente os arquivos e a rota verificados.")
          '
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee affiliate-dashboard-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-dashboard-image
          path: affiliate-dashboard-image.txt
