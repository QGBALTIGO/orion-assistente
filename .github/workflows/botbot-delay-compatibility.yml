name: Orion - atrasos BotBot e validade dos envios
on:
  pull_request:
    paths:
      - 'app/subscription_chatbot_botbot.py'
      - 'app/subscription_chatbot_schemas.py'
      - 'app/subscription_chatbot_rules.py'
      - 'app/subscription_chatbot.py'
      - 'app/static/orion-subscription-chatbot.js'
      - 'tests/unit/test_subscription_chatbot_botbot.py'
      - 'tests/unit/test_subscription_chatbot_rules.py'
      - 'tests/fixtures/subscription_chatbot_contract.json'
      - 'ui-tests/subscription-chatbot.test.mjs'
      - '.github/workflows/botbot-delay-compatibility.yml'
permissions:
  contents: read
concurrency:
  group: botbot-delay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      INBOX_SEND_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock '.[test]'
      - name: Testar unidade temporal, grafos e importação
        run: |
          python -m compileall -q app/subscription_chatbot_botbot.py app/subscription_chatbot_rules.py app/subscription_chatbot_schemas.py
          python -m pytest -q -ra tests/unit/test_subscription_chatbot_botbot.py tests/unit/test_subscription_chatbot_rules.py tests/unit/test_subscription_chatbot_archive.py tests/unit/test_subscription_chatbot_api.py
  unit-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar editor e fluxo de importação
        run: |
          node --check app/static/orion-subscription-chatbot.js
          node --test ui-tests/subscription-chatbot.test.mjs ui-tests/subscription-chatbot-card-actions.test.mjs
