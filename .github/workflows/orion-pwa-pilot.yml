name: Orion — PWA iOS e push administrativo (isolado)
on:
  pull_request:
    paths:
      - "app/orion_pwa_*.py"
      - "app/static/orion-pwa*"
      - "app/static/panel.html"
      - "app/static/orion-suite.js"
      - "app/main.py"
      - "tests/unit/test_orion_pwa_push.py"
      - "ui-tests/orion-pwa.test.mjs"
      - "pyproject.toml"
      - "requirements.lock"
      - ".github/workflows/orion-pwa-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: API, VAPID real sem rede e ícones PNG
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
      - name: Testar PWA e Web Push sem envio externo
        run: |
          python -m py_compile app/orion_pwa_icon.py app/orion_pwa_api.py
          pytest -q -ra tests/unit/test_orion_pwa_push.py

  frontend:
    name: Safari PWA, consentimento e Service Worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências isoladas de interface
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar sintaxe dos scripts PWA
        run: |
          node --check app/static/orion-pwa.js
          node --check app/static/orion-pwa-sw.js
      - name: Executar os fluxos sem enviar push real
        run: node --test ui-tests/orion-pwa.test.mjs
