name: Orion - Google Agenda para empresarios e clientes
on:
  pull_request:
    paths:
      - 'app/calendar_worker.py'
      - 'app/worker.py'
      - 'app/integrations_api.py'
      - 'app/public_site_api.py'
      - 'app/static/orion-calendar-links.js'
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'app/static/orion-appointment.html'
      - 'app/static/orion-appointment.js'
      - 'app/static/orion-suite.js'
      - 'ui-tests/public-google-calendar-links.test.mjs'
      - 'ui-tests/public-harness.mjs'
      - 'tests/integration/test_google_calendar_integration.py'
      - '.github/workflows/google-calendar-end-to-end.yml'
permissions:
  contents: read
jobs:
  customer:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias travadas
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Verificar URL Google, privacidade e formularios
        run: |
          node --check app/static/orion-calendar-links.js
          node --check app/static/orion-public.js
          node --check app/static/orion-appointment.js
          node --check app/static/orion-suite.js
          node --test ui-tests/public-google-calendar-links.test.mjs ui-tests/public-confirmation-clean.test.mjs ui-tests/google-calendar-brand.test.mjs
  business:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REDIS_URL: redis://localhost:6379/15
      ORION_GOOGLE_TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_POSTGRES_TESTS: '1'
      REQUIRE_REDIS_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m py_compile app/calendar_worker.py app/worker.py app/integrations_api.py app/public_site_api.py
      - name: Testar Google API usando MockTransport
        run: python -m pytest -q tests/unit/test_google_calendar_unit.py
      - name: Configurar papeis PostgreSQL de teste
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 -v db_name=barber_saas -v runtime_password=ci-runtime-only -v migrator_password=ci-migrator-only -v support_password=ci-support-only -f infra/postgres/init/001-roles.sql
          python -m alembic upgrade head
      - name: Google OAuth, fila concorrente, autorizacao e RLS em Postgres/Redis
        run: python -m pytest -q tests/integration/test_google_calendar_integration.py
