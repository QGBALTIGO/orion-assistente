name: Orion - ações compactas do Chatbot

on:
  pull_request:
    paths:
      - 'app/static/orion-subscription-chatbot.js'
      - 'app/static/orion-subscription-chatbot.css'
      - 'ui-tests/subscription-chatbot-card-actions.test.mjs'
      - 'tests/e2e/browser_chatbot_card_actions.py'
      - '.github/workflows/chatbot-card-actions.yml'
permissions:
  contents: read
concurrency:
  group: orion-chatbot-card-actions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      INBOX_SEND_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Testar sintaxe e fluxos de botões
        run: |
          node --check app/static/orion-subscription-chatbot.js
          node --test ui-tests/subscription-chatbot-card-actions.test.mjs ui-tests/subscription-chatbot.test.mjs ui-tests/subscription-chatbot-robot-icon.test.mjs
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      INBOX_SEND_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium isolado sem dependências de sistema extras
        run: |
          python -m pip install pytest playwright==1.56.0
          python -m playwright install chromium
      - name: Verificar cartões em celular, tablet e desktop
        run: python -m pytest -q -ra tests/e2e/browser_chatbot_card_actions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatbot-compact-actions-visual
          path: test-artifacts/chatbot-compact-actions/
          if-no-files-found: warn
          retention-days: 7
