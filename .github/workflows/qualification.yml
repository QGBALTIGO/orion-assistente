name: Orion - Controle do gerador de carga
on:
  push:
    branches: [codex/whatsapp-load-diagnostics]
permissions:
  contents: read
jobs:
  paired-control:
    name: Mesma maquina - gerador padrao e uvloop (diagnostico)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qualification-owner-only
          POSTGRES_DB: qualification_seed
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d qualification_seed"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:qualification-runtime-only@127.0.0.1:5432/qualification_seed
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:qualification-migrator-only@127.0.0.1:5432/qualification_seed
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:qualification-support-only@127.0.0.1:5432/qualification_seed
      ORION_QUALIFICATION_OWNER_URL: postgresql+psycopg://postgres:qualification-owner-only@127.0.0.1:5432/postgres
      ORION_QUALIFICATION_DISPOSABLE: '1'
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6131c4748773236ffbd3aea2c776833a095e63c3
          path: work-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar as mesmas dependencias homologadas nas duas execucoes
        run: python -m pip install './work-candidate[test]' 'certifi==2026.10.18'
      - name: Preparar PostgreSQL descartavel
        env:
          PGPASSWORD: qualification-owner-only
        run: |
          psql -h 127.0.0.1 -U postgres -d qualification_seed -v ON_ERROR_STOP=1 \
            -v db_name=qualification_seed -v runtime_password=qualification-runtime-only \
            -v migrator_password=qualification-migrator-only -v support_password=qualification-support-only \
            -f work-candidate/infra/postgres/init/001-roles.sql
      - name: Registrar apenas caracteristicas do processador e versoes
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import pathlib,json,os,platform,importlib.metadata as m
          cpu=pathlib.Path('/proc/cpuinfo').read_text()
          fields={line.split(':',1)[0].strip():line.split(':',1)[1].strip() for line in cpu.splitlines() if ':' in line and line.split(':',1)[0].strip() in {'model name','cpu cores','siblings','vendor_id'}}
          pathlib.Path('artifacts/host.json').write_text(json.dumps({'diagnostic_only':True,'logical_cpus':os.cpu_count(),'platform':platform.platform(),'cpu':fields,'versions':{n:m.version(n) for n in ['fastapi','starlette','httpx','certifi','uvicorn','uvloop','SQLAlchemy','asyncpg','pydantic']}},indent=2))
          PY
      - name: Comparar o gerador padrao e uvloop com a mesma API de tres processos
        run: |
          set +e
          for generator in asyncio uvloop; do
            runner=(python scripts/qualification_load.py)
            if [ "$generator" = uvloop ]; then
              runner=(python -c 'import runpy,uvloop; uvloop.install(); runpy.run_path("scripts/qualification_load.py",run_name="__main__")')
            fi
            (cd work-candidate && "${runner[@]}" --confirm-disposable-local \
              --profile concentrated --timing-diagnostics --stage-seconds 10 --sustain-seconds 120 --warmup-seconds 5 \
              --api-workers 3 --db-pool-size 10 --db-max-overflow 0 --output "$GITHUB_WORKSPACE/artifacts/generator-$generator.json")
            status=$?
            printf 'generator_%s_exit_code=%s\n' "$generator" "$status" >> artifacts/diagnostic-exits.txt
          done
          exit 0
      - name: Guardar evidencias - diagnostico curto nao qualifica capacidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-loop-diagnostic-${{ github.sha }}
          path: artifacts/
          retention-days: 7
