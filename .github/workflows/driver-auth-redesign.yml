name: Orion Entregas - homologar redesign de acesso
on:
  push:
    branches: [codex/orion-driver-auth-redesign-20261128]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: orion-driver-auth-redesign
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconciliar com a imagem publicada
        run: python scripts/package_driver_auth_release.py prepare
      - name: Preparar navegadores
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium webkit
      - name: Validar layout, login, recuperacao e temas
        run: |
          node --check app/static/orion-delivery-driver.js
          python tests/e2e/driver_auth_redesign_browser.py
      - name: Validar primeiro acesso e fluxo das entregas
        run: |
          python tests/e2e/driver_activation_browser.py
          python tests/e2e/driver_route_portal_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-driver-auth-screenshots
          path: artifacts/driver-auth/*.png
      - name: Construir exatamente os arquivos homologados
        env:
          IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:driver-auth-redesign-${{ github.sha }}
        run: python scripts/package_driver_auth_release.py "$IMAGE" "$GITHUB_SHA"
      - name: Publicar imagem imutavel
        env:
          IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:driver-auth-redesign-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" =~ ^ghcr\.io/qgbaltigo/orion-assistente-api@sha256:[a-f0-9]{64}$ ]]
          printf 'RepoDigest=%s\n' "$digest" | tee driver-auth-image.txt
