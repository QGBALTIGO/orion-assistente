name: Orion - Preenchimento automatico no agendamento
on:
  push:
    branches: [codex/orion-booking-autofill-20261124]
    paths:
      - 'app/public_customer_area.py'
      - 'app/main.py'
      - 'app/public_site_api.py'
      - 'app/static/orion-customer-area.*'
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'tests/unit/test_public_customer_area.py'
      - 'tests/integration/test_public_customer_area_pg.py'
      - 'tests/integration/test_public_customer_birthdate_pg.py'
      - 'tests/e2e/browser_public_customer_area.py'
      - 'app/static/orion-public.css'
      - 'tests/e2e/browser_public_booking_autofill.py'
      - 'tests/integration/test_public_booking_autofill_pg.py'
      - 'Dockerfile.booking-autofill-overlay'
      - '.github/workflows/booking-autofill-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  backend:
    name: Imagem real e isolamento PostgreSQL/Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      REQUIRE_POSTGRES_TESTS: '1'
      REDIS_URL: redis://localhost:6379/15
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:booking-autofill-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar o baseline das alteracoes revisadas
        run: |
          set -euo pipefail
          BASE=bc3305be61532fc83a44259c632b30739b577f28
          for path in app/public_customer_area.py app/static/orion-public.js app/static/orion-public.css; do
            mkdir -p ".ci-baseline/$(dirname "$path")"
            git show "$BASE:$path" > ".ci-baseline/$path"
          done
          node --check app/static/orion-public.js
          node --check app/static/orion-customer-area.js
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir overlay sem substituir o restante do sistema
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile.booking-autofill-overlay -t "$IMAGE" .
          cid=$(docker create "$IMAGE")
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/srv/app/app/static/orion-public.js" /tmp/orion-public-reviewed.js
          docker cp "$cid:/srv/app/app/static/orion-customer-area.js" /tmp/orion-customer-area-reviewed.js
          node --check /tmp/orion-public-reviewed.js
          node --check /tmp/orion-customer-area-reviewed.js
      - name: Provisionar banco exclusivamente sintetico
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 -v db_name=barber_saas -v runtime_password=ci-runtime-only -v migrator_password=ci-migrator-only -v support_password=ci-support-only -f infra/postgres/init/001-roles.sql
          docker run --rm --network host --user root -e APP_DATABASE_URL -e MIGRATION_DATABASE_URL -e SUPPORT_DATABASE_URL -e REDIS_URL "$IMAGE" python -m alembic upgrade head
      - name: Validar API, sessao, historico, dados privados e cache
        run: |
          docker run --rm --network host --user root \
            -e APP_DATABASE_URL -e MIGRATION_DATABASE_URL -e SUPPORT_DATABASE_URL -e REDIS_URL -e REQUIRE_POSTGRES_TESTS \
            -v "$PWD/tests:/srv/app/tests:ro" "$IMAGE" \
            python -m pytest -q -ra tests/unit/test_public_customer_area.py tests/unit/test_public_site_asset_cache.py tests/integration/test_public_customer_area_pg.py tests/integration/test_public_customer_birthdate_pg.py tests/integration/test_public_booking_birth_date.py tests/integration/test_public_booking_autofill_pg.py
          docker run --rm -i --user root "$IMAGE" python - <<'PY'
          import asyncio
          import httpx
          from unittest.mock import AsyncMock, patch
          from uuid import uuid4
          from app.main import app

          async def verify():
              with patch("app.public_customer_area.resolve_public", new=AsyncMock(return_value=uuid4())), patch("app.public_customer_area.enabled", return_value=False):
                  async with httpx.AsyncClient(transport=httpx.ASGITransport(app=app), base_url="https://orionagenda.pro") as client:
                      response = await client.get("/api/v1/public/sites/empresa-sintetica/account")
                      assert response.status_code == 200, (response.status_code, response.text)
                      assert response.json() == {"available": False, "authenticated": False}, response.text
              print("Customer area route HTTP smoke passed")

          asyncio.run(verify())
          PY
      - name: Publicar imagem candidata imutavel (sem alterar Railway)
        run: docker push "$IMAGE"
  browser:
    name: Navegacao Chromium/WebKit e regressao do agendamento
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --init
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias sem baixar navegadores
        run: python -m pip install -r tests/e2e/requirements.txt pytest
      - name: Testar perfil e agendamento no computador e celular
        run: python -m pytest -q -ra tests/e2e/browser_public_customer_area.py tests/e2e/browser_public_cache_profile.py tests/e2e/browser_public_customer_mobile.py tests/e2e/browser_public_booking_autofill.py
