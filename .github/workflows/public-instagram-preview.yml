name: Orion - prévia Instagram dentro de Sobre nós
on:
  pull_request:
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'app/public_site_api.py'
      - 'ui-tests/public-instagram-preview.test.mjs'
      - 'tests/unit/test_public_instagram_preview.py'
      - '.github/workflows/public-instagram-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar JavaScript e interface pública
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --check app/static/orion-public.js
          node --test ui-tests/public-instagram-preview.test.mjs ui-tests/public-contact-theme.test.mjs ui-tests/public-location-hours.test.mjs
      - name: Validar CSP e escopo de frame do Instagram
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pytest -q tests/unit/test_public_instagram_preview.py tests/unit/test_public_site.py
