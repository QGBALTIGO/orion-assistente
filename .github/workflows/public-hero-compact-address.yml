name: Orion - endereço compacto no cabeçalho público
on:
  pull_request:
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-hero-address.test.mjs'
      - 'tests/e2e/browser_public_hero_address.py'
      - '.github/workflows/public-hero-compact-address.yml'
permissions:
  contents: read
jobs:
  address-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Sintaxe, endereco e regressão pública
        run: |
          node --check app/static/orion-public.js
          node --test ui-tests/public-hero-address.test.mjs ui-tests/public-hero-actions.test.mjs ui-tests/public-location-hours.test.mjs
  address-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Endereço no Chromium/WebKit — mobile e desktop
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
          python -m pytest -q -ra tests/e2e/browser_public_hero_address.py
