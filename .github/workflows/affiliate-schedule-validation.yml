name: Orion - Cadência das automações de afiliados
on:
  push:
    branches: [codex/afiliados-cadencia-fila-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar motor, agendamento e limites de publicação
        run: |
          python -m pip install -r affiliate_pilot/requirements.txt pytest pytest-asyncio
          PYTHONPATH=. python -m pytest -q affiliate_pilot/tests
      - name: Testar interface e alterações explícitas de limite
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --input-type=module --check < app/static/orion-affiliate-workspace.js
          node --test --test-reporter=spec ui-tests/affiliate-automations.test.mjs ui-tests/affiliate-offers.test.mjs ui-tests/affiliate-image-editor.test.mjs ui-tests/affiliate-history.test.mjs
      - name: Preparar patch de código sem credenciais
        run: |
          git diff 96c2175ac3658adfd45f628767f23928e2d20af9 -- affiliate_pilot app/static/orion-affiliate-workspace.js > affiliate-schedule.patch
          git archive --format=tar.gz --output=affiliate-schedule-source.tar.gz HEAD affiliate_pilot app/static/orion-affiliate-workspace.js docs/affiliate-schedule.md
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-schedule-source
          path: |
            affiliate-schedule.patch
            affiliate-schedule-source.tar.gz
