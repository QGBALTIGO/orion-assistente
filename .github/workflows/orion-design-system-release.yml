name: Orion - Contrato visual e padronização
on:
  push:
    branches: [codex/design-system-orion-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      packages: write
    env:
      BASE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:1496b14ed8af7871487ea41d14ce391843d012f75082223595fe44f62c62145f
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:design-system-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Empacotar alterações visuais sobre produção
        run: |
          docker pull "$BASE"
          docker build --build-arg BASE_IMAGE="$BASE" --build-arg ORION_RELEASE="$GITHUB_SHA" -f deploy/Dockerfile.design-system -t "$IMAGE" .
          test "$(docker image inspect --format '{{.Config.User}}' "$BASE")" = "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$BASE")" = "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")"
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/srv/app/app/static/." app/static/
          docker rm "$cid"
          node --check app/static/orion-suite.js
          node --input-type=module --check < app/static/orion-affiliate-workspace.js
          node --input-type=module --check < app/static/orion-affiliate-shortener.js
          python scripts/audit_orion_ui.py app/static artifacts/orion-ui-inventory.json
      - name: Testes de regressão do painel e da conta
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=spec ui-tests/unified-account.test.mjs ui-tests/member-account-settings.test.mjs ui-tests/admin-only-operator-navigation.test.mjs ui-tests/affiliate-shortener.test.mjs
      - name: Conferir a interface real em Chromium e WebKit
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
          python ui-tests/orion-design-system-layout.py --engine chromium --assets app/static
          python ui-tests/orion-design-system-layout.py --engine webkit --assets app/static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-ui-evidence
          path: artifacts/
      - name: Publicar imagem validada no GHCR
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee design-system-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-image
          path: design-system-image.txt
