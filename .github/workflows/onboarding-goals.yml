name: Orion - desafios, objetivos e revisao

on:
  pull_request:
    paths:
      - 'app/onboarding_schemas.py'
      - 'app/onboarding_service.py'
      - 'app/static/orion-onboarding.js'
      - 'app/static/orion-onboarding.css'
      - 'ui-tests/onboarding-*.test.mjs'
      - 'tests/unit/test_onboarding_goals.py'
      - 'tests/integration/test_onboarding_goals_postgres.py'
      - 'tests/e2e/browser_onboarding_goals_review.py'
      - '.github/workflows/onboarding-goals.yml'
  push:
    branches: [main]
    paths:
      - 'app/onboarding_schemas.py'
      - 'app/onboarding_service.py'
      - 'app/static/orion-onboarding.js'
      - 'app/static/orion-onboarding.css'
      - 'ui-tests/onboarding-*.test.mjs'
      - 'tests/unit/test_onboarding_goals.py'
      - 'tests/integration/test_onboarding_goals_postgres.py'
      - 'tests/e2e/browser_onboarding_goals_review.py'
      - '.github/workflows/onboarding-goals.yml'

permissions:
  contents: read

jobs:
  dom:
    name: Interacoes, salvamento e regressao do onboarding
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar sintaxe do controlador
        run: node --check app/static/orion-onboarding.js
      - name: Testar respostas, revisao e fluxos anteriores
        run: |
          node --test \
            ui-tests/onboarding-goals-review.test.mjs \
            ui-tests/onboarding-business-hours.test.mjs \
            ui-tests/onboarding-profile.test.mjs \
            ui-tests/onboarding-rhythm.test.mjs \
            ui-tests/onboarding-save.test.mjs \
            ui-tests/onboarding-shell.test.mjs

  contracts:
    name: Contratos estritos e permissoes preservadas
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock '.[test]'
      - name: Validar enums, compatibilidade e protecoes
        run: |
          python -m pytest -q -ra \
            tests/unit/test_onboarding_goals.py \
            tests/unit/test_onboarding_profile.py \
            tests/unit/test_onboarding.py \
            tests/unit/test_onboarding_no_professionals_step.py \
            tests/unit/test_onboarding_business_hours.py

  postgres:
    name: PostgreSQL real - tenant, idempotencia e conclusao
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orion_goals_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-onboarding
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d orion_goals_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-goals-runtime@127.0.0.1:5432/orion_goals_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-goals-migrator@127.0.0.1:5432/orion_goals_ci
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-goals-support@127.0.0.1:5432/orion_goals_ci
      REQUIRE_POSTGRES_TESTS: '1'
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock '.[test]'
      - name: Provisionar papeis de menor privilegio
        env:
          PGPASSWORD: ci-only-postgres-onboarding
        run: |
          psql -h 127.0.0.1 -U postgres -d orion_goals_ci -v ON_ERROR_STOP=1 \
            -v db_name=orion_goals_ci \
            -v runtime_password=ci-goals-runtime \
            -v migrator_password=ci-goals-migrator \
            -v support_password=ci-goals-support \
            -f infra/postgres/init/001-roles.sql
      - name: Migrar banco descartavel
        run: python -m alembic upgrade head
      - name: Provar persistencia e isolamento reais
        run: python -m pytest -q -ra tests/integration/test_onboarding_goals_postgres.py

  browser:
    name: Chromium e WebKit - 8 larguras e 2 temas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegadores de teste
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Verificar alinhamento, selecoes e revisao
        run: python -m pytest -q -ra tests/e2e/browser_onboarding_goals_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-goals-review-layout
          path: test-artifacts/onboarding-rhythm/
          if-no-files-found: warn
          retention-days: 7
