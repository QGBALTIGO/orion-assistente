name: Orion - confirmacao publica compacta telefone e nascimento

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/public_site_api.py'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-confirmation-clean.test.mjs'
      - 'ui-tests/orion-public.test.mjs'
      - 'ui-tests/public-multiservice.test.mjs'
      - 'tests/integration/test_public_booking_birth_date.py'
      - 'tests/e2e/browser_public_confirmation_clean.py'
      - '.github/workflows/public-confirmation-clean-20261027.yml'
  push:
    branches: [main]
    paths:
      - 'app/public_site_api.py'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-confirmation-clean.test.mjs'
      - 'ui-tests/orion-public.test.mjs'
      - 'ui-tests/public-multiservice.test.mjs'
      - 'tests/integration/test_public_booking_birth_date.py'
      - 'tests/e2e/browser_public_confirmation_clean.py'
      - '.github/workflows/public-confirmation-clean-20261027.yml'

permissions:
  contents: read

jobs:
  dom:
    name: Confirmacao e mascara com DOM real
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Sintaxe e regressao do agendamento publico
        run: |
          node --check app/static/orion-public.js
          node --test \
            ui-tests/public-confirmation-clean.test.mjs \
            ui-tests/orion-public.test.mjs \
            ui-tests/public-multiservice.test.mjs \
            ui-tests/public-professional-smooth.test.mjs \
            ui-tests/public-slot-periods.test.mjs

  browser:
    name: iPhone Safari WebKit e Chromium responsivo
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Validar formulario em cinco navegadores/tamanhos
        run: python -m pytest -q -ra tests/e2e/browser_public_confirmation_clean.py

  postgres:
    name: Gravar aniversario no cliente somente apos reservar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-retries 20
          --health-timeout 3s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
          --health-timeout 3s
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: '1'
      ORION_INTAKE_TEST_REDIS_URL: redis://localhost:6379/15
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar runtime e testes fixados
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
          python -m py_compile app/public_site_api.py tests/integration/test_public_booking_birth_date.py
      - name: Provisionar PostgreSQL isolado
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade head
      - name: Validar DOB, compatibilidade, isolamento e replay
        run: |
          python -m pytest -q -ra tests/integration/test_public_booking_birth_date.py
          python -m pytest -q -ra tests/integration/test_public_catalog.py -k test_public_booking_real_snapshot_consent_replay_conflict_and_metrics
