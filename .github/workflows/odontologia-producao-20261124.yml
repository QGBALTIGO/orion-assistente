name: Orion - Publicação do painel odontológico
on:
  push:
    branches: [codex/orion-odontologia-release-20261124]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:f4474d1d9606ff816a79342350f28aaf2a739f506579aef70c3e1dd26286747c
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:odontologia-producao-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir odontologia e os demais nichos
        run: |
          node --check app/static/orion-suite.js
          node --check app/static/orion-public.js
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=dot ui-tests/dental-workspace.test.mjs ui-tests/dental-clinic.test.mjs ui-tests/dental-patient-journey.test.mjs ui-tests/barbershop-app-layout.test.mjs ui-tests/subscription-workspace.test.mjs ui-tests/home-admin-preview.test.mjs ui-tests/member-account-settings.test.mjs ui-tests/dashboard-navigation.test.mjs ui-tests/plan-permissions.test.mjs ui-tests/appointment-operations-panel.test.mjs ui-tests/agenda-lifecycle.test.mjs ui-tests/professional-commissions.test.mjs ui-tests/customer-whatsapp-shortcut.test.mjs ui-tests/public-contact-theme.test.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir o painel que está em produção
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint python "$BASE_IMAGE" -c '
          import hashlib
          from pathlib import Path
          expected = {
            "app/management_models.py": "6cfc7cfe0ca55af3aff9432d6f6173fa64caf7b0",
            "app/public_site_api.py": "19467c49f0f5688d3d9614028e327c632e36e0f0",
            "app/site_publication.py": "e426f59a56a64da8c54efd0511709e8890f21e3c",
            "app/static/orion-dental-clinic.css": "4eb52a19312da1c86c45a01d4d5bc5c9578d7653",
            "app/static/orion-suite.js": "3489902b63ef7cb6df0defb80c24783ccbc56c79",
            "app/static/orion-public.js": "543219d43adf71a588d06340bcc3412322ea160f",
          }
          for name, digest in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(b"blob %d" % len(data) + bytes(1) + data).hexdigest() == digest, name
          '
      - name: Construir e validar imagem candidata
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f deploy/Dockerfile.dental-public --build-arg ORION_DENTAL_COMMIT="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c '
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from app.dental_reception import router
          from app.public_site_api import Publication
          assert ScriptDirectory.from_config(Config("alembic.ini")).get_current_head() == "0093_dental_reception"
          assert "dental_procedures" in Publication.model_fields
          assert any(route.path.endswith("/booking-options") for route in router.routes)
          '
          sha256sum app/management_models.py app/public_site_api.py app/site_publication.py app/static/orion-dental-clinic.css app/static/orion-suite.js app/static/orion-public.js | docker run --rm -i -w /srv/app --entrypoint sha256sum "$IMAGE" --strict --check -
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee odontologia-producao-image.txt
          echo "$BASE_IMAGE" > odontologia-retorno-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: odontologia-producao-image
          path: |
            odontologia-producao-image.txt
            odontologia-retorno-image.txt
