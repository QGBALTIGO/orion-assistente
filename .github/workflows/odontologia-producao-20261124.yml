name: Orion - Publicação do painel odontológico
on:
  push:
    branches: [codex/orion-odontologia-release-20261124]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:663563d41054bbd3cafafa42918bf07c58eca3e998fbcc318869c88e25cac2db
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:odontologia-producao-${{ github.sha }}
      RESTORE_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:odontologia-retorno-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir odontologia e os demais nichos
        run: |
          node --check app/static/orion-suite.js
          node --check app/static/orion-dental-clinic.js
          node --check app/static/orion-dental-reception.js
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=dot ui-tests/dental-workspace.test.mjs ui-tests/dental-clinic.test.mjs ui-tests/dental-patient-journey.test.mjs ui-tests/barbershop-app-layout.test.mjs ui-tests/subscription-workspace.test.mjs ui-tests/home-admin-preview.test.mjs ui-tests/member-account-settings.test.mjs ui-tests/dashboard-navigation.test.mjs ui-tests/plan-permissions.test.mjs ui-tests/appointment-operations-panel.test.mjs ui-tests/agenda-lifecycle.test.mjs ui-tests/professional-commissions.test.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir o painel que está em produção
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint python "$BASE_IMAGE" -c '
          import hashlib
          from pathlib import Path
          expected = {
            "app/main.py": "0dc258f20be6fa58e12aba953dad5e6f39c85c72",
            "app/booking_service.py": "8c268ce6a635632507411c5ed63ed9d94652408b",
            "app/plan_routing.py": "65fc841227f5f9bd53d7441193498360d22dd517",
            "app/professional_commissions.py": "e004b9dba05a29115e91159b01baa92eb5512cc7",
            "app/static/panel.html": "a31cea1f4cda5af6f9ae53a5ef57f95f8e59732c",
            "app/static/orion-suite.js": "fc047a94b0d60811aa11f0d1f2a7a7558508000a",
            "app/static/orion-dental-clinic.js": "ffb1b6ddda51c8458f0323fa022d2957853ed043",
            "app/static/orion-dental-clinic.css": "40763bb61cb9806c5a00dbeb042ec00155763901",
          }
          for name, digest in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha1(b"blob %d" % len(data) + bytes(1) + data).hexdigest() == digest, name
          '
      - name: Construir e validar imagem candidata
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f deploy/Dockerfile.dental-reception --build-arg ORION_DENTAL_COMMIT="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c '
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from app.dental_reception import router
          from scripts.backup_and_migrate_dental_workflows import TARGET
          assert ScriptDirectory.from_config(Config("alembic.ini")).get_current_head() == TARGET == "0093_dental_reception"
          assert any(route.path.endswith("/booking-options") for route in router.routes)
          assert any(route.path.endswith("/reception/appointments") and "POST" in route.methods for route in router.routes)
          '
          docker run --rm --entrypoint pg_dump "$IMAGE" --version
          sha256sum app/main.py app/plan_routing.py app/booking_service.py app/professional_commissions.py app/dental_reception.py app/dental_reception_schemas.py app/static/panel.html app/static/orion-dental-reception.js app/static/orion-suite.js app/static/orion-dental-clinic.css alembic/versions/0093_dental_reception.py scripts/backup_and_migrate_dental_workflows.py scripts/backup_and_migrate_subscription_audience.py | docker run --rm -i -w /srv/app --entrypoint sha256sum "$IMAGE" --strict --check -
          docker build --platform linux/amd64 -f deploy/Dockerfile.dental-reception --target previous-panel --build-arg ORION_DENTAL_COMMIT="$GITHUB_SHA" -t "$RESTORE_IMAGE" .
          docker push "$RESTORE_IMAGE"
          docker image inspect "$RESTORE_IMAGE" --format '{{index .RepoDigests 0}}' > odontologia-retorno-image.txt
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee odontologia-producao-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: odontologia-producao-image
          path: |
            odontologia-producao-image.txt
            odontologia-retorno-image.txt
