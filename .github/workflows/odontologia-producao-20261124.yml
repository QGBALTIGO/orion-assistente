name: Orion - Publicação do painel odontológico
on:
  push:
    branches: [codex/orion-odontologia-release-20261124]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:b0d30e92ce6b15909220f76dc13b0b932019ef4c8c22b75dab10dfe08a6cc12a
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:odontologia-producao-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir odontologia e os demais nichos
        run: |
          node --check app/static/orion-suite.js
          node --check app/static/orion-dental-clinic.js
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=dot ui-tests/dental-workspace.test.mjs ui-tests/dental-clinic.test.mjs ui-tests/dental-patient-journey.test.mjs ui-tests/barbershop-app-layout.test.mjs ui-tests/subscription-workspace.test.mjs ui-tests/home-admin-preview.test.mjs ui-tests/member-account-settings.test.mjs ui-tests/dashboard-navigation.test.mjs ui-tests/plan-permissions.test.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conferir o painel que está em produção
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint python "$BASE_IMAGE" -c '
          import hashlib
          from pathlib import Path
          expected = {
            "panel.html": "b735a318934252b0a4f2b2f3e13ad55818722100",
            "orion-suite.js": "bbddeba8a1cc4306be35f778559f449e60731c4b",
            "orion-dental-clinic.js": "d7de72b8d0db808d427fa749d971b2e94e969338",
            "orion-dental-clinic.css": "7c1708a5cfb5fbf1be86d801129208e1e4aa2d0b",
          }
          for name, digest in expected.items():
              data = (Path("app/static") / name).read_bytes()
              assert hashlib.sha1(b"blob %d" % len(data) + bytes(1) + data).hexdigest() == digest, name
          '
      - name: Construir e validar imagem candidata
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f deploy/Dockerfile.dental-workflows --build-arg ORION_DENTAL_COMMIT="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c '
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from app.dental_clinic_api import router
          from scripts.backup_and_migrate_dental_workflows import TARGET
          assert ScriptDirectory.from_config(Config("alembic.ini")).get_current_head() == TARGET == "0091_dental_insurance_plans"
          assert sum(route.path.endswith("/insurance-plans") for route in router.routes) == 2
          '
          docker run --rm --entrypoint pg_dump "$IMAGE" --version
          sha256sum app/static/orion-suite.js app/static/orion-dental-clinic.js app/static/orion-dental-clinic.css app/dental_clinic_api.py app/dental_clinic_schemas.py alembic/versions/0091_dental_insurance_plans.py | docker run --rm -i -w /srv/app --entrypoint sha256sum "$IMAGE" --strict --check -
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee odontologia-producao-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: odontologia-producao-image
          path: odontologia-producao-image.txt
