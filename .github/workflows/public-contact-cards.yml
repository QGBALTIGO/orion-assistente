name: Orion - contatos visuais proporcionais
on:
  pull_request:
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-contact-theme.test.mjs'
      - 'tests/e2e/browser_public_contact_cards.py'
      - '.github/workflows/public-contact-cards.yml'
permissions:
  contents: read
jobs:
  dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Conferir labels links e padrão visual
        run: |
          node --check app/static/orion-public.js
          node --test ui-tests/public-contact-theme.test.mjs ui-tests/public-audit.test.mjs ui-tests/public-location-hours.test.mjs
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simular 0 a 6 canais em Android/iPhone/desktop
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
          python -m pytest -q -ra tests/e2e/browser_public_contact_cards.py tests/e2e/browser_public_contact_theme.py
