name: Orion - horarios de inicio manuais

on:
  push:
    branches:
      - feat/manual-start-times-20261103
      - security/prelaunch-hardening-20261030
    paths:
      - app/start_policies.py
      - app/booking_service.py
      - app/catalog_api.py
      - app/onboarding_service.py
      - app/plan_routing.py
      - app/main.py
      - app/static/orion-suite.js
      - app/static/orion-suite.css
      - alembic/versions/0060_manual_start_times.py
      - scripts/*manual_start_times*.py
      - scripts/predeploy_one_click_links.py
      - scripts/backup_and_migrate_*.py
      - scripts/wait_for_single_whatsapp_schema.py
      - tests/**/test*manual_start*.py
      - tests/unit/test_start_policies.py
      - ui-tests/orion-hours.test.mjs
      - .github/workflows/manual-start-times.yml
  pull_request:
    branches: [main, security/prelaunch-hardening-20261030]
    paths:
      - app/start_policies.py
      - app/booking_service.py
      - app/catalog_api.py
      - app/onboarding_service.py
      - app/static/orion-suite.js
      - app/static/orion-suite.css
      - alembic/versions/0060_manual_start_times.py
      - scripts/*manual_start_times*.py
      - tests/**/test*manual_start*.py
      - ui-tests/orion-hours.test.mjs
      - .github/workflows/manual-start-times.yml

permissions:
  contents: read

concurrency:
  group: manual-start-times-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Disponibilidade, reservas, isolamento e migracao PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: synthetic-manual-start-times-ci-token-20261103-000000000000000
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same pinned runtime as production
        run: |
          python -m pip install -c requirements.lock '.[test]'
          python -m pip check
      - name: Create isolated PostgreSQL roles
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
      - name: Apply the existing schema and the optional scheduling migration
        run: |
          alembic upgrade 0059_prepaid_pix
          alembic upgrade head
          python - <<'PY'
          import asyncio, os
          from scripts.backup_and_migrate_manual_start_times import schema_ready
          from scripts.wait_for_manual_start_times_schema import probe_schema, Settings
          assert schema_ready(os.environ['MIGRATION_DATABASE_URL'])
          assert asyncio.run(probe_schema(Settings.from_environment(), 10))
          print('manual_start_schema_and_runtime_barrier_verified')
          PY
      - name: Verify policy, release gates, permissions and onboarding
        run: |
          pytest -q -ra \
            tests/unit/test_start_policies.py \
            tests/unit/test_slot_query_budget.py \
            tests/unit/test_manual_start_times_release.py \
            tests/unit/test_0056_predeploy_guard.py \
            tests/unit/test_cakto_post_0053_predeploy.py \
            tests/unit/test_single_whatsapp_release.py \
            tests/unit/test_plan_routing.py \
            tests/unit/test_onboarding.py \
            tests/unit/test_onboarding_business_hours.py \
            tests/unit/test_onboarding_digest_compatibility.py \
            tests/unit/test_onboarding_state_encoding.py \
            tests/unit/test_onboarding_readiness_budget.py \
            tests/unit/test_public_opening_hours.py
      - name: Exercise public and internal booking with real PostgreSQL
        run: |
          pytest -q -ra \
            tests/integration/test_manual_start_times.py \
            tests/integration/test_public_manual_start_times.py \
            tests/integration/test_booking.py \
            tests/integration/test_weekly_hour_edit_pg.py \
            tests/integration/test_catalog.py \
            tests/integration/test_public_catalog.py \
            tests/integration/test_public_hours_live.py \
            tests/integration/test_public_booking_professional_contention.py \
            tests/integration/test_onboarding_postgres.py \
            tests/integration/test_onboarding_readiness_postgres.py \
            tests/integration/test_onboarding_batched_reads_postgres.py \
            tests/integration/test_rls.py

  ui:
    name: Editor de horarios e fluxo publico
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Verify existing assets and scheduling interactions
        run: |
          node --check app/static/orion-suite.js
          node --test \
            ui-tests/orion-hours.test.mjs \
            ui-tests/public-multiservice.test.mjs \
            ui-tests/public-slot-periods.test.mjs \
            ui-tests/public-professional-smooth.test.mjs \
            ui-tests/public-location-hours.test.mjs

  browser:
    name: Layout real ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install -c requirements.lock -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Validate light and dark layouts and public selection
        env:
          ORION_UI_BROWSER: ${{ matrix.browser }}
        run: python -m pytest -q -ra tests/e2e/test_manual_start_times_responsive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-start-times-${{ matrix.browser }}
          path: test-results/manual-start-times
          if-no-files-found: ignore
