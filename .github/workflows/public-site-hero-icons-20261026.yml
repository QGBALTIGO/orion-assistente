name: Orion - site publico (SVG, catalogo e layout)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.css'
      - 'app/static/orion-public.js'
      - 'ui-tests/orion-public.test.mjs'
      - 'ui-tests/public-hero-actions.test.mjs'
      - 'tests/e2e/browser_public_hero_actions.py'
      - '.github/workflows/public-site-hero-icons-20261026.yml'

permissions:
  contents: read

jobs:
  public-hero-dom:
    name: DOM de catalogo, mapa e compartilhamento
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias isoladas da interface
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Verificar funcionalidade pública e acessibilidade
        run: |
          node --check app/static/orion-public.js
          node --test \
            ui-tests/public-hero-actions.test.mjs \
            ui-tests/orion-public.test.mjs

  public-hero-mobile:
    name: Catalogo e SVG em iPhone e desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador sem credenciais
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Validar SVG, posicoes, labels e compartilhar
        run: python -m pytest -q -ra tests/e2e/browser_public_hero_actions.py
