name: Orion - Pix unico 30 dias (sem assinatura automatica)
on:
  push:
    branches: [security/prelaunch-hardening-20261030]
    paths:
      - "app/prepaid_pix_api.py"
      - "app/prepaid_pix_reconcile.py"
      - "app/cakto_api.py"
      - "app/plan_permissions.py"
      - "app/plan_management.py"
      - "app/plan_routing.py"
      - "app/static/orion-plans.js"
      - "app/main.py"
      - "alembic/versions/0059_prepaid_pix.py"
      - "scripts/backup_and_migrate_prepaid_pix.py"
      - "tests/unit/test_prepaid_pix.py"
      - "tests/unit/test_prepaid_pix_webhook.py"
      - "tests/integration/test_prepaid_pix_postgres.py"
      - "ui-tests/orion-plans.test.mjs"
      - ".github/workflows/prepaid-pix-20261103.yml"
  pull_request:
    paths:
      - "app/prepaid_pix_api.py"
      - "app/prepaid_pix_reconcile.py"
      - "alembic/versions/0059_prepaid_pix.py"
      - "ui-tests/orion-plans.test.mjs"
permissions:
  contents: read
jobs:
  code:
    name: API Pix unico, webhook e isolamento PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -c requirements.lock ".[test]"
      - name: Isolated PostgreSQL roles
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
      - name: Full reviewed migration in ephemeral DB
        run: alembic upgrade head
      - name: API, RLS, idempotency, prepaid periods and signed webhooks
        run: |
          python -m py_compile \
            app/prepaid_pix_api.py app/prepaid_pix_reconcile.py \
            app/plan_permissions.py app/cakto_api.py \
            scripts/backup_and_migrate_prepaid_pix.py
          pytest -q -ra \
            tests/unit/test_prepaid_pix.py \
            tests/unit/test_prepaid_pix_webhook.py \
            tests/unit/test_cakto_integration.py \
            tests/unit/test_plan_permissions.py \
            tests/integration/test_prepaid_pix_postgres.py \
            tests/integration/test_cakto_postgres.py

  ui:
    name: UI Pix QR, manual renewal and all screen controls
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Verify only Pix, no card/recurring SDK or charge without consent
        run: |
          node --check app/static/orion-plans.js
          node --test ui-tests/orion-plans.test.mjs
