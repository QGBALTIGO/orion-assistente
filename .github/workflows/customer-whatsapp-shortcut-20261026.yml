name: Orion - atalho WhatsApp em clientes (mobile)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-suite.js'
      - 'app/static/orion-suite.css'
      - 'ui-tests/customer-whatsapp-shortcut.test.mjs'
      - 'tests/e2e/browser_customer_whatsapp_shortcut.py'
      - 'scripts/prepare_vercel_orion.py'
      - '.github/workflows/customer-whatsapp-shortcut-20261026.yml'

permissions:
  contents: read

jobs:
  customer-mobile-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated UI dependencies
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax, client cards, history and forms
        run: |
          node --check app/static/orion-suite.js
          node --test \
            ui-tests/customer-whatsapp-shortcut.test.mjs \
            ui-tests/customer-form.test.mjs \
            ui-tests/customer-history.test.mjs
  customer-mobile-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browsers only
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Check real browser positioning on 320px and 390px
        run: python -m pytest -q -ra tests/e2e/browser_customer_whatsapp_shortcut.py
  vercel-facade-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend test dependencies
        run: python -m pip install -c requirements.lock '.[test]'
      - name: Check source hash and private bundle output
        run: python -m pytest -q -ra tests/test_vercel_orion_bundle.py tests/test_vercel_orion_routes.py
