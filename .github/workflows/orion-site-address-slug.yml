name: Orion - Meu site, endereço e link público

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/management_api.py'
      - 'app/management_models.py'
      - 'app/management_preferences.py'
      - 'app/management_schemas.py'
      - 'app/site_*.py'
      - 'app/public_site_api.py'
      - 'app/public_site_rendering.py'
      - 'app/static/orion-suite.*'
      - 'app/static/orion-public.*'
      - 'tests/unit/test_site_address_slugs.py'
      - 'tests/unit/test_site_publication.py'
      - 'tests/unit/test_public_site_rendering.py'
      - 'tests/integration/test_site_address_slugs_postgres.py'
      - 'tests/integration/test_site_publication_postgres.py'
      - 'tests/integration/test_public_site_rendering_postgres.py'
      - 'tests/integration/test_public_catalog.py'
      - 'tests/e2e/test_site_address_slug.py'
      - 'tests/e2e/fixtures/site_address_slug.js'
      - 'ui-tests/site-address-slug.test.mjs'
      - 'ui-tests/site-publication.test.mjs'
      - 'ui-tests/public-location-hours.test.mjs'
      - 'ui-tests/public-hero-actions.test.mjs'
      - '.github/workflows/orion-site-address-slug.yml'
  push:
    branches: [main]
    paths:
      - 'app/management_api.py'
      - 'app/management_models.py'
      - 'app/management_preferences.py'
      - 'app/management_schemas.py'
      - 'app/site_*.py'
      - 'app/public_site_api.py'
      - 'app/public_site_rendering.py'
      - 'app/static/orion-suite.*'
      - 'app/static/orion-public.*'
      - 'tests/unit/test_site_address_slugs.py'
      - 'tests/unit/test_site_publication.py'
      - 'tests/unit/test_public_site_rendering.py'
      - 'tests/integration/test_site_address_slugs_postgres.py'
      - 'tests/integration/test_site_publication_postgres.py'
      - 'tests/integration/test_public_site_rendering_postgres.py'
      - 'tests/integration/test_public_catalog.py'
      - 'tests/e2e/test_site_address_slug.py'
      - 'tests/e2e/fixtures/site_address_slug.js'
      - 'ui-tests/site-address-slug.test.mjs'
      - 'ui-tests/site-publication.test.mjs'
      - 'ui-tests/public-location-hours.test.mjs'
      - 'ui-tests/public-hero-actions.test.mjs'
      - '.github/workflows/orion-site-address-slug.yml'

permissions:
  contents: read

jobs:
  postgres:
    name: Endereço, publicação, reservas de slug e isolamento
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: synthetic-site-address-ci-token-at-least-32-characters
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências fixadas
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
      - name: Preparar papéis restritos e aplicar a revisão do checkout
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          python -m alembic upgrade head
          python -m alembic current --check-heads
      - name: Verificar legado, preferências, snapshot público, SEO e concorrência
        run: |
          python -m pytest -q -ra \
            tests/unit/test_site_address_slugs.py \
            tests/unit/test_management_unit.py \
            tests/unit/test_site_publication.py \
            tests/unit/test_public_site_rendering.py \
            tests/integration/test_site_address_slugs_postgres.py \
            tests/integration/test_site_publication_postgres.py \
            tests/integration/test_public_site_rendering_postgres.py

  dom:
    name: CEP, sugestões, endereço e Google Maps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar respostas atrasadas, edição manual e publicação
        run: |
          node --check app/static/orion-suite.js
          node --check app/static/orion-public.js
          node --check tests/e2e/fixtures/site_address_slug.js
          node --test ui-tests/site-address-slug.test.mjs \
            ui-tests/site-publication.test.mjs \
            ui-tests/public-location-hours.test.mjs \
            ui-tests/public-hero-actions.test.mjs \
            ui-tests/orion-public.test.mjs

  browser:
    name: Meu site - ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependências dos testes
        run: python -m pip install -r tests/e2e/requirements.txt pytest
      - name: Verificar Chrome pré-instalado
        if: matrix.browser == 'chromium'
        run: google-chrome --version
      - name: Instalar Safari isolado
        if: matrix.browser == 'webkit'
        timeout-minutes: 6
        run: python -m playwright install --with-deps webkit
      - name: Verificar CEP, sugestões, teclado e formulário em telas reais
        env:
          ORION_TEST_SYSTEM_CHROME: '1'
        run: python -m pytest -q -ra tests/e2e/test_site_address_slug.py -k "${{ matrix.browser }}"
