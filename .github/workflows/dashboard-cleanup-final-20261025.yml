name: Orion — limpeza final do Dashboard
on:
  push:
    branches: [codex/remove-dashboard-personalize-site-link-20261025]
    paths:
      - 'app/static/orion-suite.js'
      - 'ui-tests/dashboard-navigation.test.mjs'
      - 'scripts/prepare_vercel_orion.py'
      - '.github/workflows/dashboard-cleanup-final-20261025.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Conferir sintaxe da interface
        run: node --check app/static/orion-suite.js
      - name: Testes de Dashboard e integridade do bundle Vercel
        run: node --test ui-tests/dashboard-navigation.test.mjs ui-tests/vercel-facade.test.mjs
      - name: Testes completos do painel
        run: npm test --prefix ui-tests
      - name: Verificar geração homologada sem rede
        run: python3 scripts/prepare_vercel_orion.py --output /tmp/orion-dashboard-final-check
