name: Orion - fotos e datas suaves no agendamento

on:
  push:
    branches: [main, fix/public-booking-professionals-smooth-20261026]
    paths:
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-professional-smooth.test.mjs'
      - 'tests/e2e/browser_public_professional_smooth.py'
      - 'tests/e2e/browser_public_layout_refinement.py'
      - '.github/workflows/public-professional-smooth-20261026.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-professional-smooth.test.mjs'
      - 'tests/e2e/browser_public_professional_smooth.py'
      - 'tests/e2e/browser_public_layout_refinement.py'

permissions:
  contents: read

jobs:
  professional-dom:
    name: Estabilidade do DOM e seleção (sem reinstalar fotos)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar sintaxe e testes de regressão
        run: |
          node --check app/static/orion-public.js
          node --test \
            ui-tests/public-professional-smooth.test.mjs \
            ui-tests/orion-public.test.mjs \
            ui-tests/public-multiservice.test.mjs \
            ui-tests/public-contact-theme.test.mjs

  professional-browser:
    name: iPhone/WebKit e desktop/Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright e dependências do WebKit
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Verificar enquadramento, nomes longos, foco e estabilidade das fotos
        run: |
          python -m pytest -q -ra \
            tests/e2e/browser_public_professional_smooth.py \
            tests/e2e/browser_public_multiservice.py \
            tests/e2e/browser_public_contact_theme.py \
            tests/e2e/browser_public_layout_refinement.py
      - name: Guardar capturas e medidas das regressões de layout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-layout-refinement
          path: test-artifacts/public-layout-refinement/
          if-no-files-found: warn
          retention-days: 7
