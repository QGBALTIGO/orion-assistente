name: WhatsApp reliability and recovery
on:
  push:
    branches: [codex/whatsapp-reliability-20261105]
  pull_request:
    paths: ['qr-bridge/**', 'app/qr_*.py', 'app/subscription_devices.py', 'app/static/orion-subscription-devices.js', 'tests/**', 'ui-tests/subscription-connection-health.test.mjs', '.github/workflows/whatsapp-reliability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whatsapp-reliability-${{ github.ref }}
  cancel-in-progress: true
env:
  META_LIVE_SEND: '0'
  QR_AI_ENABLED: '0'
  INBOX_SEND_ENABLED: '0'
  MARKETING_EXECUTION_ENABLED: '0'
  ORION_NOTIFY_SELF_ON_LINK: '0'
  QR_BRIDGE_URL: ''
  PYTHONUTF8: '1'
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm ci --prefix qr-bridge --ignore-scripts --no-audit --no-fund
      - name: Complete transport suite and inherited failure comparison
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '976698882c666250c54a54675a91cb13f2d7f937' }}
        run: |
          mkdir -p /tmp/whatsapp-base
          git archive "$BASE_SHA" | tar -x -C /tmp/whatsapp-base
          ln -s "$PWD/qr-bridge/node_modules" /tmp/whatsapp-base/qr-bridge/node_modules
          set +e
          (cd /tmp/whatsapp-base && node --test --test-reporter=tap qr-bridge/test/*.test.mjs) > /tmp/whatsapp-baseline.tap 2>&1
          baseline=$?
          node --test --test-reporter=tap qr-bridge/test/*.test.mjs > /tmp/whatsapp-candidate.tap 2>&1
          candidate=$?
          set -e
          test "$baseline" -le 1
          test "$candidate" -le 1
          python scripts/check_whatsapp_regression.py /tmp/whatsapp-baseline.tap /tmp/whatsapp-candidate.tap /tmp/whatsapp-regression.json
      - name: New recovery and real pinned protocol regressions must pass
        run: node --test qr-bridge/test/connection-health.test.mjs qr-bridge/test/primary-transport-lease.test.mjs qr-bridge/test/interactive-fallback.test.mjs qr-bridge/test/assistant-parts.test.mjs qr-bridge/test/wa-version-policy.test.mjs
      - run: npm audit --prefix qr-bridge --omit=dev --audit-level=high
      - run: docker build -t orion-whatsapp-reliability qr-bridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: whatsapp-reliability-transport
          path: |
            /tmp/whatsapp-baseline.tap
            /tmp/whatsapp-candidate.tap
            /tmp/whatsapp-regression.json
          retention-days: 7
  postgres-and-redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: barber_saas, POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci-postgres-only}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d barber_saas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REDIS_URL: redis://localhost:6379/15
      ORION_INTAKE_TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_POSTGRES_TESTS: '1'
      REQUIRE_REDIS_TESTS: '1'
      ORION_REQUIRE_INTAKE_REDIS_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -c requirements.lock '.[test]'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16 ffmpeg
      - name: Separate synthetic database roles and current schema
        env: {PGPASSWORD: ci-postgres-only}
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 -v db_name=barber_saas -v runtime_password=ci-runtime-only -v migrator_password=ci-migrator-only -v support_password=ci-support-only -f infra/postgres/init/001-roles.sql
          python -m alembic upgrade head
      - name: Owner loss, crash, safe recovery, mixed input and tenant boundaries
        run: |
          python -m pytest -q -ra tests/qualification/whatsapp_reliability_postgres.py tests/integration/test_qr_channels_postgres.py tests/integration/test_qr_channels_transaction_postgres.py tests/integration/test_qr_single_connection_postgres.py tests/integration/test_qr_revocation_quarantine_postgres.py tests/integration/test_qr_conversation_lock_redis.py tests/integration/test_qr_intake_revision_redis.py tests/integration/test_single_whatsapp_release_postgres.py tests/integration/test_professional_phone_release_pg.py tests/unit/test_professional_phone_release.py tests/unit/test_qr_turn_ownership.py tests/unit/test_qr_batch_recovery.py tests/unit/test_whatsapp_pending_purpose.py tests/unit/test_subscription_connection_health.py tests/unit/test_qr_channels_human_pause.py tests/unit/test_appointment_message_templates.py --junitxml=/tmp/whatsapp-recovery.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: whatsapp-reliability-database, path: /tmp/whatsapp-recovery.xml}
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - run: node --test ui-tests/subscription-connection-health.test.mjs ui-tests/subscription-devices.test.mjs
