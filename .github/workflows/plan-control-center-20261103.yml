name: Orion - upgrades e central de planos
on:
  push:
    branches: [feature/plan-upgrades-control-center-20261103]
permissions:
  contents: write
concurrency:
  group: plan-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Upgrades, estornos, central financeira e responsividade
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exactly reviewed source patch on isolated branch
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          directory=pathlib.Path('.orion-review')
          parts=sorted(directory.glob('part*.b64'))
          if parts:
              assert len(parts)==14,'Incomplete patch'
              raw=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
              assert hashlib.sha256(raw).hexdigest()=='dbfd278c2f7b94ca0d867f1c827da5316ec8629ad1f541cb1571bfb08cdabbb5','Patch checksum mismatch'
              path=pathlib.Path('/tmp/orion-plan-control.patch');path.write_bytes(raw)
              subprocess.run(['git','apply','--check',str(path)],check=True)
              subprocess.run(['git','apply','--index',str(path)],check=True)
          for fix in sorted(directory.glob('fix*.patch')):
              subprocess.run(['git','apply','--check',str(fix)],check=True)
              subprocess.run(['git','apply','--index',str(fix)],check=True)
          PY
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned test dependencies
        run: |
          python -m pip install -c requirements.lock '.[test]'
          python -m pip install -r tests/e2e/requirements.txt
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          python -m playwright install --with-deps chromium
      - name: Isolated PostgreSQL roles
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade head
      - name: Business rules, authoritative Pix, RLS and financial center
        run: |
          python -m compileall -q app scripts alembic
          pytest -q -ra \
            tests/unit/test_plan_upgrade_policy.py \
            tests/unit/test_plan_control.py \
            tests/unit/test_plan_permissions.py \
            tests/unit/test_prepaid_pix.py \
            tests/unit/test_prepaid_pix_webhook.py \
            tests/integration/test_prepaid_pix_postgres.py \
            tests/integration/test_plan_control_upgrades.py
      - name: DOM and payment upgrade interface
        run: |
          node --check app/static/orion-plan-control.js
          node --check app/static/orion-plans.js
          node --test ui-tests/orion-plans.test.mjs ui-tests/plan-control.test.mjs
      - name: Real browser - 320, 390, 768 and 1440 pixels, light and dark
        env:
          ORION_SCREENSHOT_DIR: /tmp/orion-plan-screenshots
        run: pytest -q -ra tests/e2e/browser_plan_control.py
      - name: Commit only validated source on this feature branch
        env:
          TARGET_BRANCH: feature/plan-upgrades-control-center-20261103
        run: |
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          remote=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          if test -d .orion-review; then git rm -r .orion-review; fi
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'Orion validated release'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Liberar upgrade Pix e central administrativa de planos após testes PostgreSQL e navegador'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          git archive --format=tar.gz --output=/tmp/validated-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-control-validation
          path: |
            /tmp/orion-plan-screenshots
            /tmp/validated-source.tar.gz
          retention-days: 2
