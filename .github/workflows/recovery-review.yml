name: Recovery source review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-snapshots:
    if: github.head_ref == 'fix/login-agenda-notifications-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download public test dependencies
        run: |
          mkdir -p toolkit/wheels
          python -m pip download --only-binary=:all: --dest toolkit/wheels asyncpg arq 'psycopg[binary]' pytest-asyncio
          npm ci --prefix candidate/ui-tests
          tar -czf toolkit/ui-node-modules.tar.gz -C candidate/ui-tests node_modules
          sha256sum toolkit/wheels/* toolkit/ui-node-modules.tar.gz > toolkit/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-development-toolkit
          path: toolkit/
          retention-days: 3
          if-no-files-found: error
