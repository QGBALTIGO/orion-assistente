name: Orion - comodidades compactas dentro de Onde estamos
on:
  pull_request:
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-amenities.test.mjs'
      - 'tests/e2e/browser_public_amenities.py'
      - '.github/workflows/public-amenities-inside-location.yml'
permissions:
  contents: read
jobs:
  public-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar scripts e integração com os cards do site
        run: |
          node --check app/static/orion-public.js
          node --test ui-tests/public-amenities.test.mjs ui-tests/public-location-hours.test.mjs ui-tests/public-audit.test.mjs ui-tests/public-contact-theme.test.mjs
  public-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium e WebKit, mobile e desktop
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
          python -m pytest -q -ra tests/e2e/browser_public_amenities.py
