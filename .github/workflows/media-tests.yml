name: Orion media uploads

on:
  pull_request:
    paths:
      - 'app/media_*.py'
      - 'app/catalog_schemas.py'
      - 'app/management_schemas.py'
      - 'app/main.py'
      - 'app/static/orion-suite.js'
      - 'app/static/orion-public.js'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'tests/unit/test_media_api.py'
      - '.github/workflows/media-tests.yml'
  workflow_dispatch:

jobs:
  media-unit:
    name: Image format, authorization and persistence tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Verify Python syntax
        run: python -m compileall -q app tests/unit/test_media_api.py
      - name: Run isolated media tests (no database or bucket required)
        run: python -m pytest -q tests/unit/test_media_api.py
