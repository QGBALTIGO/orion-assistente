name: Orion - Tema noturno preto
on:
  push:
    branches: [codex/orion-black-theme-20261124]
    paths:
      - 'app/static/orion-public.css'
      - 'app/static/orion-public-theme.js'
      - 'app/static/orion-public.js'
      - 'tests/e2e/browser_public_contact_theme.py'
      - 'ui-tests/public-contact-theme.test.mjs'
      - 'Dockerfile.black-theme-overlay'
      - '.github/workflows/black-theme-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Tema publico e confirmacao em Chromium/WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe e instalar dependencias existentes
        run: |
          node --check app/static/orion-public-theme.js
          node --check app/static/orion-public.js
          npm ci --prefix ui-tests
          python -m pip install -r tests/e2e/requirements.txt pytest
      - name: Testar preferencia de tema e contatos
        run: |
          node --test ui-tests/public-contact-theme.test.mjs
          python -m pytest -q -ra tests/e2e/browser_public_contact_theme.py
      - name: Testar confirmacao no celular e desktop
        run: python -m pytest -q -ra tests/e2e/browser_public_confirmation_sizing.py -k '390 or 1440'
      - name: Guardar capturas para revisao visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-theme-${{ github.sha }}
          path: test-artifacts/confirmation-sizing/
          if-no-files-found: error
          retention-days: 7
  image:
    name: Publicar overlay somente apos os testes
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:black-theme-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar baseline dos arquivos publicos em producao
        run: |
          set -euo pipefail
          BASELINE_COMMIT=23175fad1f3c8f84b50e21f9b6f6d73b4e8a56af
          for path in app/static/orion-public.css app/static/orion-public-theme.js app/static/orion-public.js; do
            mkdir -p ".ci-baseline/$(dirname "$path")"
            git show "$BASELINE_COMMIT:$path" > ".ci-baseline/$path"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e conferir os arquivos da imagem
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile.black-theme-overlay -t "$IMAGE" .
          container_id=$(docker create "$IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/orion-black-theme-reviewed
          for path in app/static/orion-public.css app/static/orion-public-theme.js app/static/orion-public.js; do
            reviewed_file="/tmp/orion-black-theme-reviewed/$(basename "$path")"
            docker cp "$container_id:/srv/app/$path" "$reviewed_file"
            cmp "$path" "$reviewed_file"
          done
          node --check /tmp/orion-black-theme-reviewed/orion-public-theme.js
          node --check /tmp/orion-black-theme-reviewed/orion-public.js
      - name: Publicar imagem candidata sem alterar Railway
        run: docker push "$IMAGE"
