name: Orion - padronizacao dos campos

on:
  pull_request:
    paths:
      - 'app/**'
      - 'landing/**'
      - 'ui-tests/**'
      - 'tests/unit/test_brazilian_form_contracts.py'
      - 'tests/unit/test_fields_assets.py'
      - 'tests/e2e/browser_public_*.py'
      - 'tests/e2e/browser_fields_standardization.py'
      - 'tests/e2e/browser_fields_access.py'
      - 'tests/e2e/fixtures/fields-panel.js'
      - 'tests/e2e/test_finance_responsive.py'
      - 'tests/e2e/test_performance_history_goals.py'
      - 'tests/e2e/browser_package_cards_compact.py'
      - 'tests/e2e/test_hours_responsive.py'
      - 'tests/e2e/browser_customer_whatsapp_shortcut.py'
      - 'tests/e2e/test_site_address_slug.py'
      - 'tests/e2e/browser_service_editor_price.py'
      - 'scripts/inventory_fields.py'
      - '.github/workflows/fields-standardization.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'landing/**'
      - 'ui-tests/**'
      - 'tests/unit/test_brazilian_form_contracts.py'
      - 'tests/unit/test_fields_assets.py'
      - 'tests/e2e/browser_public_*.py'
      - 'tests/e2e/browser_fields_standardization.py'
      - 'tests/e2e/browser_fields_access.py'
      - 'tests/e2e/fixtures/fields-panel.js'
      - 'tests/e2e/test_finance_responsive.py'
      - 'tests/e2e/test_performance_history_goals.py'
      - 'tests/e2e/browser_package_cards_compact.py'
      - 'tests/e2e/test_hours_responsive.py'
      - 'tests/e2e/browser_customer_whatsapp_shortcut.py'
      - 'tests/e2e/test_site_address_slug.py'
      - 'tests/e2e/browser_service_editor_price.py'
      - 'scripts/inventory_fields.py'
      - '.github/workflows/fields-standardization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dom:
    name: Core, consumidores e integracao DOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Sintaxe dos consumidores
        run: |
          node --check app/static/orion-fields.js
          node --check app/static/orion-suite.js
          node --check app/static/orion-public.js
          node --check app/static/orion-onboarding.js
          node --check app/static/orion-channels.js
          node --check app/static/orion-invite.js
          node --check landing/assets/orion-landing.js
      - name: Contratos novos de preenchimento
        run: |
          node --test --test-isolation=none \
            ui-tests/fields-core.test.mjs \
            ui-tests/fields-integration.test.mjs \
            ui-tests/fields-auth.test.mjs \
            ui-tests/fields-conditional.test.mjs \
            ui-tests/fields-public-consumers.test.mjs \
            ui-tests/fields-onboarding-channels.test.mjs \
            ui-tests/fields-panel-legacy.test.mjs \
            ui-tests/orion-landing.test.mjs \
            ui-tests/invite-verification.test.mjs
      - name: Regressoes DOM existentes
        run: npm test --prefix ui-tests

  contracts:
    name: Contratos backend, assets e inventario
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias fixadas
        run: python -m pip install -c requirements.lock ".[test]"
      - name: Validacao servidor e assets reais
        run: |
          python -m pytest -q -ra \
            tests/unit/test_brazilian_form_contracts.py \
            tests/unit/test_fields_assets.py \
            tests/unit/test_live_suite_asset.py \
            tests/unit/test_professional_phone.py \
            tests/unit/test_professional_commissions.py \
            tests/unit/test_commercial_catalog.py \
            tests/unit/test_site_address_slugs.py \
            tests/unit/test_onboarding.py \
            tests/unit/test_management_extras_unit.py
      - name: Inventario reproduzivel do checkout
        run: |
          mkdir -p test-artifacts/fields-standardization
          python scripts/inventory_fields.py --output test-artifacts/fields-standardization/inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fields-contracts-inventory
          path: test-artifacts/fields-standardization
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Campos e layout - ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixtures reutilizadas dos testes DOM
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador isolado de CI
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Seis dimensoes, ambos os temas e regressoes publicas
        run: |
          python -m pytest -q -ra \
            tests/e2e/browser_fields_standardization.py \
            tests/e2e/browser_fields_access.py \
            tests/e2e/browser_public_confirmation_sizing.py \
            tests/e2e/browser_public_booking_footer.py \
            tests/e2e/browser_public_confirmation_clean.py \
            tests/e2e/browser_public_hero_actions.py \
            tests/e2e/browser_public_professional_smooth.py \
            tests/e2e/browser_public_contact_theme.py \
            tests/e2e/browser_public_multiservice.py \
            tests/e2e/browser_public_slot_periods.py \
            tests/e2e/browser_public_amenities.py \
            tests/e2e/test_finance_responsive.py \
            tests/e2e/test_performance_history_goals.py \
            tests/e2e/browser_package_cards_compact.py \
            tests/e2e/test_hours_responsive.py \
            tests/e2e/browser_customer_whatsapp_shortcut.py \
            tests/e2e/test_site_address_slug.py \
            tests/e2e/browser_service_editor_price.py \
            -k '${{ matrix.engine }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fields-${{ matrix.engine }}-geometry
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
