name: Orion - Histórico profissional e metas mensais
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/management_api.py'
      - 'app/management_models.py'
      - 'app/management_schemas.py'
      - 'app/performance_history.py'
      - 'app/static/orion-suite.js'
      - 'app/static/orion-suite.css'
      - 'alembic/versions/0037_recurring_goals.py'
      - 'scripts/backup_and_migrate_recurring_goals.py'
      - 'scripts/backup_and_migrate_site_publication.py'
      - 'tests/integration/test_performance_history.py'
      - 'tests/integration/test_recurring_goals*.py'
      - 'tests/unit/test_recurring_goals_release.py'
      - 'ui-tests/performance-history-goals.test.mjs'
      - 'ui-tests/dashboard-finance-goals.test.mjs'
      - 'tests/e2e/test_performance_history_goals.py'
      - 'tests/e2e/fixtures/performance_history_goals.js'
      - '.github/workflows/orion-performance-history-goals.yml'
  push:
    branches: [main]
    paths:
      - 'app/management_api.py'
      - 'app/management_models.py'
      - 'app/management_schemas.py'
      - 'app/performance_history.py'
      - 'app/static/orion-suite.js'
      - 'app/static/orion-suite.css'
      - 'alembic/versions/0037_recurring_goals.py'
      - 'scripts/backup_and_migrate_recurring_goals.py'
      - 'scripts/backup_and_migrate_site_publication.py'
      - 'tests/integration/test_performance_history.py'
      - 'tests/integration/test_recurring_goals*.py'
      - 'tests/unit/test_recurring_goals_release.py'
      - 'ui-tests/performance-history-goals.test.mjs'
      - 'ui-tests/dashboard-finance-goals.test.mjs'
      - 'tests/e2e/test_performance_history_goals.py'
      - 'tests/e2e/fixtures/performance_history_goals.js'
      - '.github/workflows/orion-performance-history-goals.yml'
permissions:
  contents: read
jobs:
  postgres:
    name: Histórico, recorrência, isolamento e migração
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências fixadas
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
      - name: Preparar banco e aplicar a revisão deste checkout
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          python -m alembic upgrade head
          python -m alembic current --check-heads
      - name: Validar ciclos, permissões, regressão e barreiras de publicação
        run: |
          pytest -q -ra \
            tests/integration/test_performance_history.py \
            tests/integration/test_recurring_goals.py \
            tests/integration/test_recurring_goals_release_postgres.py \
            tests/integration/test_management.py \
            tests/integration/test_finance_entry_context.py \
            tests/unit/test_recurring_goals_release.py \
            tests/unit/test_site_publication_release.py
  dom:
    name: Filtros, histórico, metas e dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar navegação, erros, escopos e compatibilidade
        run: |
          node --check app/static/orion-suite.js
          node --test ui-tests/performance-history-goals.test.mjs \
            ui-tests/dashboard-finance-goals.test.mjs ui-tests/orion-suite.test.mjs
  browser:
    name: Histórico e metas - Safari e Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Safari e usar Chrome pré-instalado
        run: |
          google-chrome --version
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps webkit
      - name: Verificar leitura, detalhes, filtros, paginação e cadastro em sete tamanhos
        env:
          ORION_TEST_SYSTEM_CHROME: '1'
        run: python -m pytest -q -ra tests/e2e/test_performance_history_goals.py
