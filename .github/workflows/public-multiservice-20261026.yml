name: Orion - agendamento publico multiservicos

on:
  push:
    branches: [main, feat/public-custom-multiservice-booking-20261026]
    paths:
      - 'app/public_site_api.py'
      - 'app/static/orion-public.*'
      - 'tests/unit/test_public_site.py'
      - 'tests/integration/test_public_catalog.py'
      - 'ui-tests/public-multiservice.test.mjs'
      - 'tests/e2e/browser_public_multiservice.py'
      - '.github/workflows/public-multiservice-20261026.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/public_site_api.py'
      - 'app/static/orion-public.*'
      - 'tests/unit/test_public_site.py'
      - 'tests/integration/test_public_catalog.py'
      - 'ui-tests/public-multiservice.test.mjs'
      - 'tests/e2e/browser_public_multiservice.py'
      - '.github/workflows/public-multiservice-20261026.yml'

permissions:
  contents: read

jobs:
  multi-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar sintaxe e compatibilidade do assistente
        run: |
          node --check app/static/orion-public.js
          node --test ui-tests/public-multiservice.test.mjs ui-tests/orion-public.test.mjs ui-tests/public-contact-theme.test.mjs

  multi-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Chromium e WebKit em iPhone, tablet e desktop
        run: |
          python -m pytest -q -ra tests/e2e/browser_public_multiservice.py tests/e2e/browser_public_hero_actions.py
  multi-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-retries 20
          --health-timeout 3s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 20
          --health-timeout 3s
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: "1"
      ORION_INTAKE_TEST_REDIS_URL: redis://localhost:6379/15
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar versões do runtime testado
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
      - name: Cliente PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Papéis separados e banco real migrado
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade head
      - name: Contrato assinado e fluxo completo de múltiplos serviços
        run: |
          python -m pytest -q -ra tests/unit/test_public_site.py
          python -m pytest -q -ra tests/integration/test_public_catalog.py -k public_custom
