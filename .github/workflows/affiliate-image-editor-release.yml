name: Orion - Personalização dos templates de imagem
on:
  push:
    branches: [codex/afiliados-identidade-imagens-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    env:
      BASE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:c362d23de394f408309c48f1a4c92bfe451ca318bad2a83522e8fd825542478a
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:affiliate-image-editor-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar renderizador, persistência e fluxos de envio simulados
        run: |
          python -m pip install -r affiliate_pilot/requirements.txt pytest pytest-asyncio
          PYTHONPATH=. python -m pytest -q affiliate_pilot/tests
      - name: Validar editor e regressões dos afiliados
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --input-type=module --check < app/static/orion-affiliate-workspace.js
          node --test --test-reporter=spec ui-tests/affiliate-image-editor.test.mjs ui-tests/affiliate-automations.test.mjs ui-tests/affiliate-offers.test.mjs ui-tests/affiliate-history.test.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparar imagem incremental do painel
        run: |
          docker pull "$BASE"
          docker build --build-arg BASE_IMAGE="$BASE" --build-arg ORION_RELEASE="$GITHUB_SHA" -f deploy/Dockerfile.affiliate-image-editor -t "$IMAGE" .
          test "$(docker image inspect --format '{{.Config.User}}' "$BASE")" = "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$BASE")" = "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")"
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee affiliate-image-editor-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-image-editor-image
          path: affiliate-image-editor-image.txt
