name: Orion - verificar cadastro de entregadores publicado
on:
  push:
    branches: [codex/delivery-courier-directory-smoke-20261128]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar dominio real sem contas ou pedidos de clientes
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://orionagenda.pro
          T=00000000-0000-4000-8000-000000000001
          w="$(mktemp -d)"
          trap 'rm -rf "$w"' EXIT
          check() {
            curl -fsS --max-time 12 "$BASE/health" -o "$w/health" &&
            curl -fsS --max-time 12 "$BASE/entregador/$T/?primeiro-acesso=1" -o "$w/portal" &&
            curl -fsS --max-time 12 "$BASE/panel-assets/orion-delivery-driver.js?release=28a8f54" -o "$w/driver" &&
            curl -fsS --max-time 12 "$BASE/panel-assets/orion-delivery-logistics.js?release=28a8f54" -o "$w/logistics" &&
            curl -fsS --max-time 12 "$BASE/panel-assets/orion-suite.js?release=28a8f54" -o "$w/suite" &&
            cmp -s "$w/portal" app/static/orion-delivery-driver.html &&
            cmp -s "$w/driver" app/static/orion-delivery-driver.js &&
            cmp -s "$w/logistics" app/static/orion-delivery-logistics.js &&
            grep -Fq "const deliveryCouriersRoute='entregadores-delivery';" "$w/suite" &&
            grep -Fq "routeNames[deliveryCouriersRoute]='Entregadores';" "$w/suite"
          }
          ready=0
          for i in $(seq 1 24); do
            if check; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          status="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "$BASE/api/v1/tenants/$T/delivery/logistics/couriers/access-directory")"
          case "$status" in 401|403) ;; *) echo "Unexpected unauthenticated status: $status"; exit 1;; esac
          curl -fsS --max-time 12 "$BASE/auth/features" -o "$w/features"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("Public registration enabled:",d.get("registration") is True); print("Email test mode:",d.get("testMode") is True)' "$w/features"
          echo "Published menu, logistics and courier activation assets verified."
          echo "Unauthenticated access directory: HTTP $status. No customer or order data accessed."
