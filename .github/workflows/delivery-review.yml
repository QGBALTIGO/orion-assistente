name: Orion - Homologação de Delivery e Distribuição
on:
  push:
    branches: [codex/delivery-operacao-20261127]
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'tests/**'
      - 'ui-tests/**'
      - '.github/workflows/delivery-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d barber_saas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      REDIS_URL: redis://localhost:6379/15
      SUPPORT_API_TOKEN: synthetic-delivery-test-token-never-use-in-production
      REQUIRE_POSTGRES_TESTS: '1'
      ORION_DELIVERY_BROWSER_TEST: '1'
      ORION_DELIVERY_WEBKIT_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar dependências e banco isolado
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          python -m pip install -c requirements.lock ".[test]" -r tests/e2e/requirements.txt
          python -m pip check
          python -m playwright install --with-deps chromium webkit
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only -f infra/postgres/init/001-roles.sql
          alembic upgrade head
      - name: Persistência, concorrência, isolamento e navegador
        run: |
          pytest -q -ra tests/integration/test_delivery_catalog_postgres.py \
            tests/integration/test_delivery_orders_postgres.py \
            tests/integration/test_delivery_containers_postgres.py \
            tests/integration/test_delivery_logistics_postgres.py tests/integration/test_delivery_order_containers_postgres.py \
            tests/integration/test_delivery_payments_postgres.py tests/integration/test_delivery_reports_postgres.py \
            tests/integration/test_delivery_storefront_postgres.py tests/unit/test_delivery_container_orders.py \
            tests/integration/test_commercial_catalog_postgres.py tests/integration/test_commercial_fulfillment_postgres.py
      - name: Pareamento WhatsApp e isolamento entre nichos
        run: |
          pytest -q -ra tests/integration/test_subscription_devices_postgres.py -k "delivery_whatsapp_connection or affiliate_whatsapp_pairing or real_auth_csrf_membership_niche"
      - name: Regressão das interfaces da Orion
        run: |
          python -m compileall -q app
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --check app/static/orion-delivery-catalog.js
          node --check app/static/orion-delivery-dashboard.js
          node --check app/static/orion-delivery-editor.js
          node --check app/static/orion-delivery-orders.js
          node --check app/static/orion-delivery-containers.js
          node --check app/static/orion-delivery-order-containers.js
          node --check app/static/orion-delivery-logistics.js
          node --check app/static/orion-delivery-reports.js
          node --check app/static/orion-delivery-store-admin.js
          node --check app/static/orion-delivery-store.js
          node --check app/static/orion-delivery-driver.js
          node --check app/static/orion-delivery-driver-sw.js
          node --test --test-reporter=dot ui-tests/delivery-catalog.test.mjs ui-tests/dashboard-navigation.test.mjs \
            ui-tests/plan-permissions.test.mjs ui-tests/onboarding-entry.test.mjs ui-tests/subscription-workspace.test.mjs \
            ui-tests/barbershop-app-layout.test.mjs ui-tests/dashboard-finance-goals.test.mjs ui-tests/dental-workspace.test.mjs \
            ui-tests/onboarding-affiliates.test.mjs ui-tests/orion-finance-mobile.test.mjs
          node --test --test-reporter=dot ui-tests/delivery-logistics.test.mjs ui-tests/delivery-order-containers.test.mjs ui-tests/delivery-reports.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-ui
          path: artifacts/delivery-browser/*.png

  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar verificadores somente no ambiente de testes
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          python -m pip install -c requirements.lock ".[test]"
          python -m venv /tmp/orion-analysis
          /tmp/orion-analysis/bin/pip install ruff==0.12.12 mypy==1.18.2 pip-audit==2.9.0
      - name: Verificar os módulos da distribuição
        run: |
          python -m pip check
          pytest -q tests/unit/test_media_api.py tests/unit/test_orion_pwa_push.py tests/unit/test_subscription_chatbot_media.py tests/unit/test_subscription_template_pdf.py
          /tmp/orion-analysis/bin/ruff check --select E9,F63,F7,F82 app/delivery_*.py
          /tmp/orion-analysis/bin/mypy --python-executable "$(which python)" --check-untyped-defs --follow-imports=silent --ignore-missing-imports app/delivery_driver_api.py app/delivery_purchasing.py app/delivery_performance.py
      - name: Consultar avisos de segurança das versões fixadas
        if: always()
        run: |
          /tmp/orion-analysis/bin/pip-audit --disable-pip --no-deps -r requirements.lock --format json --output delivery-dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-dependency-audit
          path: delivery-dependency-audit.json
      - name: Listar pacotes com avisos no relatório
        if: always() && hashFiles('delivery-dependency-audit.json') != ''
        run: |
          python - <<'PY'
          import json
          for pkg in json.load(open('delivery-dependency-audit.json'))['dependencies']:
              alerts = pkg.get('vulns', [])
              if alerts:
                  fixes = sorted({version for alert in alerts for version in alert['fix_versions']})
                  print(pkg['name'], pkg['version'], len(alerts), 'correções publicadas', ', '.join(fixes))
          PY
