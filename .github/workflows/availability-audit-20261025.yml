name: Orion — Disponibilidade real, site e WhatsApp
on:
  push:
    branches: [codex/orion-booking-availability-audit-20261025]
    paths:
      - 'app/booking_service.py'
      - 'app/public_site_api.py'
      - 'app/static/orion-public.js'
      - 'app/qr_ai.py'
      - 'tests/unit/test_slot_query_budget.py'
      - 'tests/unit/test_whatsapp_slot_distribution.py'
      - 'ui-tests/availability-errors.test.mjs'
      - '.github/workflows/availability-audit-20261025.yml'
permissions:
  contents: read
jobs:
  booking-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REDIS_URL: redis://localhost:6379/15
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências de testes fixas
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
          python -m py_compile app/booking_service.py app/public_site_api.py app/qr_ai.py
      - name: Configurar papéis de teste isolados
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
      - name: Migrar somente banco efêmero da CI
        run: alembic upgrade head
      - name: Validar paridade do motor, contratos públicos e disponibilidade do QR
        env:
          ORION_INTAKE_TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          pytest -q -ra \
            tests/unit/test_slot_query_budget.py \
            tests/unit/test_whatsapp_slot_distribution.py \
            tests/unit/test_public_site.py \
            tests/unit/test_qr_ai.py \
            tests/unit/test_qr_ai_interruptions.py \
            tests/integration/test_slot_prefetch_postgres.py \
            tests/integration/test_booking.py \
            tests/integration/test_public_catalog.py \
            tests/integration/test_qr_context_availability_postgres.py
  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar DOM fixo do painel
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar JS do site
        run: node --check app/static/orion-public.js
      - name: Testar indisponibilidade, erros e recuperação do site
        run: node --test ui-tests/orion-public.test.mjs ui-tests/availability-errors.test.mjs
      - name: Rodar regressões DOM completas
        run: npm test --prefix ui-tests
