name: Orion - painel do nicho de assinaturas

on:
  pull_request:
    paths:
      - 'app/account_business.py'
      - 'app/plan_permissions.py'
      - 'app/plan_routing.py'
      - 'app/plan_management.py'
      - 'app/workspace_policy.py'
      - 'app/onboarding_schemas.py'
      - 'app/onboarding_service.py'
      - 'app/static/orion-suite.js'
      - 'app/static/panel.html'
      - 'tests/unit/test_subscription_workspace.py'
      - 'tests/integration/test_subscription_workspace_postgres.py'
      - 'tests/e2e/browser_subscription_workspace.py'
      - 'ui-tests/subscription-workspace.test.mjs'
      - '.github/workflows/subscription-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'app/account_business.py'
      - 'app/plan_permissions.py'
      - 'app/plan_routing.py'
      - 'app/plan_management.py'
      - 'app/workspace_policy.py'
      - 'app/onboarding_schemas.py'
      - 'app/onboarding_service.py'
      - 'app/static/orion-suite.js'
      - 'app/static/panel.html'
      - 'tests/unit/test_subscription_workspace.py'
      - 'tests/integration/test_subscription_workspace_postgres.py'
      - 'tests/e2e/browser_subscription_workspace.py'
      - 'ui-tests/subscription-workspace.test.mjs'
      - '.github/workflows/subscription-workspace.yml'

permissions:
  contents: read

env:
  CAKTO_BILLING_LIVE_ENABLED: '0'
  ORION_DIRECT_PAYMENTS_ENABLED: '0'
  META_LIVE_SEND: '0'
  QR_AI_ENABLED: '0'
  INBOX_SEND_ENABLED: '0'
  MARKETING_EXECUTION_ENABLED: '0'

jobs:
  contracts:
    name: Nicho, permissoes e regressao dos outros negocios
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock '.[test]'
      - name: Validar isolamento, planos e cadastro
        run: |
          python -m pytest -q -ra \
            tests/unit/test_subscription_workspace.py \
            tests/unit/test_plan_permissions.py \
            tests/unit/test_plan_routing.py \
            tests/unit/test_account_business.py \
            tests/unit/test_maintenance_access.py \
            tests/unit/test_manual_plan_management.py \
            tests/unit/test_checkout_manual_priority.py \
            tests/unit/test_onboarding_completion_plan.py \
            tests/unit/test_onboarding_subscription_niche.py \
            tests/unit/test_onboarding.py \
            tests/unit/test_onboarding_goals.py

  dom:
    name: Menu, conta, atalhos e navegacao existentes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - run: node --check app/static/orion-suite.js
      - name: Validar painel real e manter os outros nichos
        run: |
          node --test \
            ui-tests/subscription-workspace.test.mjs \
            ui-tests/onboarding-completion-access.test.mjs \
            ui-tests/onboarding-subscription-niche.test.mjs \
            ui-tests/onboarding-panel-integration.test.mjs \
            ui-tests/onboarding-shell.test.mjs \
            ui-tests/onboarding-save.test.mjs \
            ui-tests/member-account-settings.test.mjs \
            ui-tests/single-business-context.test.mjs \
            ui-tests/plan-permissions.test.mjs \
            ui-tests/orion-plans.test.mjs \
            ui-tests/admin-client-center.test.mjs \
            ui-tests/orion-suite.test.mjs

  postgres:
    name: PostgreSQL real - perfil, compras, conta e concorrencia
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orion_workspace_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-workspace-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d orion_workspace_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-workspace-runtime@127.0.0.1:5432/orion_workspace_ci
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-workspace-migrator@127.0.0.1:5432/orion_workspace_ci
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-workspace-support@127.0.0.1:5432/orion_workspace_ci
      REQUIRE_POSTGRES_TESTS: '1'
      REQUIRE_REDIS_TESTS: '1'
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock '.[test]'
      - name: Provisionar papeis separados
        env:
          PGPASSWORD: ci-only-workspace-postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d orion_workspace_ci -v ON_ERROR_STOP=1 \
            -v db_name=orion_workspace_ci \
            -v runtime_password=ci-workspace-runtime \
            -v migrator_password=ci-workspace-migrator \
            -v support_password=ci-workspace-support \
            -f infra/postgres/init/001-roles.sql
      - run: python -m alembic upgrade head
      - name: Provar regras reais e preservar empresas existentes
        run: |
          python -m pytest -q -ra \
            tests/integration/test_subscription_workspace_postgres.py \
            tests/integration/test_onboarding_completion_plan_postgres.py \
            tests/integration/test_onboarding_subscription_niche_postgres.py \
            tests/integration/test_onboarding_goals_postgres.py \
            tests/integration/test_onboarding_postgres.py \
            tests/integration/test_account_self_service.py \
            tests/integration/test_scoped_panel_account_postgres.py \
            tests/integration/test_plan_runtime_postgres.py

  browser:
    name: Chromium e WebKit - celular, tablet e desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegadores de teste
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Verificar layout e fluxo completo
        run: python -m pytest -q -ra tests/e2e/browser_subscription_workspace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-workspace-layout
          path: test-artifacts/subscription-workspace/
          if-no-files-found: warn
          retention-days: 7
