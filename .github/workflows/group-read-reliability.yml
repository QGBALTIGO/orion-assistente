name: Orion - leitura de grupos WhatsApp
on:
  pull_request:
    paths:
      - 'app/qr_channels.py'
      - 'app/subscription_group_contacts.py'
      - 'app/subscription_group_add.py'
      - 'app/subscription_group_contacts_store.py'
      - 'app/subscription_group_add_store.py'
      - 'app/static/orion-subscription-group-contacts.js'
      - 'app/static/orion-subscription-group-add.js'
      - 'qr-bridge/src/device-group-contacts.mjs'
      - 'qr-bridge/src/device-group-add.mjs'
      - 'qr-bridge/src/channel-routes.mjs'
      - 'qr-bridge/test/device-group-contacts.test.mjs'
      - 'qr-bridge/test/device-group-add.test.mjs'
      - 'tests/unit/test_subscription_group_contacts.py'
      - 'tests/unit/test_subscription_group_add.py'
      - '.github/workflows/group-read-reliability.yml'
permissions:
  contents: read
concurrency:
  group: orion-read-groups-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ORION_RETRY_TEST_MODE: '1'
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      GROUP_ADD_LIVE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated bridge test dependencies
        run: npm ci --prefix qr-bridge --ignore-scripts --no-audit --no-fund
      - name: Test group reads and group-add safety without connecting WhatsApp
        run: |
          node --check qr-bridge/src/device-group-contacts.mjs
          node --check qr-bridge/src/device-group-add.mjs
          node --check qr-bridge/src/channel-routes.mjs
          node --test qr-bridge/test/device-group-contacts.test.mjs qr-bridge/test/device-group-add.test.mjs

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      INBOX_SEND_ENABLED: '0'
      GROUP_ADD_LIVE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock '.[test]'
      - name: Test tenant scope, authorization, mapping, and group reads
        run: |
          python -m compileall -q app/qr_channels.py app/subscription_group_add.py app/subscription_group_contacts.py
          python -m pytest -q -ra tests/unit/test_subscription_group_contacts.py tests/unit/test_subscription_group_add.py

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Test both group interfaces and access controls
        run: |
          node --check app/static/orion-subscription-group-contacts.js
          node --check app/static/orion-subscription-group-add.js
          node --test ui-tests/subscription-group-contacts.test.mjs ui-tests/subscription-group-add.test.mjs
