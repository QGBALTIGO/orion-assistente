name: Orion - grid proporcional de comodidades (1 a 4)
on:
  pull_request:
    paths:
      - 'app/static/orion-public.css'
      - 'ui-tests/public-amenities.test.mjs'
      - 'tests/e2e/browser_public_amenities.py'
      - '.github/workflows/amenities-balanced-grid.yml'
permissions:
  contents: read
jobs:
  public-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Grid 1-4, DOM e regressão da localização
        run: |
          node --check app/static/orion-public.js
          node --test ui-tests/public-amenities.test.mjs ui-tests/public-location-hours.test.mjs ui-tests/public-audit.test.mjs
  public-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegadores reais Chromium/WebKit — mobile e desktop
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
          python -m pytest -q -ra tests/e2e/browser_public_amenities.py
