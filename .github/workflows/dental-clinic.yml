name: Orion - Odontologia clínica, RLS e consultórios
on:
  pull_request:
    paths:
      - 'alembic/versions/0076_dental_clinic.py'
      - 'alembic/versions/0082_dental_chair_availability.py'
      - 'alembic/versions/0083_dental_intake_templates.py'
      - 'alembic/versions/0084_dental_supply_history.py'
      - 'alembic/versions/0085_dental_prosthesis_tracking.py'
      - 'alembic/versions/0086_dental_laboratories.py'
      - 'alembic/versions/0087_dental_patient_visits.py'
      - 'app/dental_clinic_*.py'
      - 'app/main.py'
      - 'app/professional_portal.py'
      - 'app/static/orion-professional.*'
      - 'app/plan_permissions.py'
      - 'app/plan_routing.py'
      - 'app/static/orion-dental-clinic.*'
      - 'app/static/orion-suite.js'
      - 'app/static/panel.html'
      - 'scripts/backup_and_migrate_dental_clinic.py'
      - 'scripts/backup_and_migrate_dental_workflows.py'
      - 'scripts/check_dental_key_history.py'
      - 'scripts/wait_for_dental_schema.py'
      - 'scripts/predeploy_one_click_links.py'
      - 'scripts/start_api.py'
      - 'tests/integration/test_dental_clinic_postgres.py'
      - 'tests/integration/test_management.py'
      - 'tests/unit/test_dental_clinic_unit.py'
      - 'tests/unit/test_dental_clinic_release.py'
      - 'tests/unit/test_start_api.py'
      - 'ui-tests/dental-clinic.test.mjs'
      - 'ui-tests/dental-workspace.test.mjs'
      - 'ui-tests/dental-reception-browser.py'
      - 'ui-tests/dental-visit-links-browser.py'
      - 'ui-tests/dental-stock-browser.py'
      - 'ui-tests/dental-directory-browser.py'
      - 'ui-tests/dashboard-today-preview.test.mjs'
      - 'ui-tests/professional-portal.test.mjs'
      - 'deploy/Dockerfile.dental-workflows'
      - '.github/workflows/dental-clinic.yml'
permissions:
  contents: read
jobs:
  clinic-validation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_ci_admin_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:synthetic_ci_migrator_only@127.0.0.1:5432/orion_dental_ci
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:synthetic_ci_runtime_only@127.0.0.1:5432/orion_dental_ci
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:synthetic_ci_support_only@127.0.0.1:5432/orion_dental_ci
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Criar banco e papéis restritos de teste (dados sintéticos)
        run: |
          PGPASSWORD=synthetic_ci_admin_only psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_runtime LOGIN PASSWORD 'synthetic_ci_runtime_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE app_migrator LOGIN PASSWORD 'synthetic_ci_migrator_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE app_support LOGIN PASSWORD 'synthetic_ci_support_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE DATABASE orion_dental_ci OWNER app_migrator;
          SQL
          PGPASSWORD=synthetic_ci_migrator_only psql -U app_migrator -d orion_dental_ci -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON DATABASE orion_dental_ci FROM PUBLIC;
          GRANT CONNECT ON DATABASE orion_dental_ci TO app_runtime,app_support;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO app_runtime,app_support;
          SQL
      - name: Instalar dependências bloqueadas
        run: python -m pip install --disable-pip-version-check -c requirements.lock '.[test]'
      - name: Validar sintaxe dos módulos
        run: |
          python -m compileall -q app/dental_clinic_api.py app/dental_clinic_schemas.py app/dental_clinic_media.py alembic/versions/0076_dental_clinic.py
          node --check app/static/orion-suite.js
          node --check app/static/orion-dental-clinic.js
          node --check app/static/orion-professional.js
      - name: Migrações em PostgreSQL 16 limpo
        run: python -m alembic upgrade head
      - name: Verificar contrato de papéis, RLS e migração
        run: |
          python -m scripts.wait_for_dental_schema
          python - <<'PY'
          import os
          from scripts.backup_and_migrate_dental_workflows import workflows_ready
          raise SystemExit(0 if workflows_ready(os.environ["MIGRATION_DATABASE_URL"]) else 3)
          PY
      - name: Testar conflitos concorrentes e isolamento real entre empresas
        run: >-
          PYTHONPATH=tests python -m pytest -q tests/integration/test_dental_clinic_postgres.py
          tests/integration/test_management.py::test_dental_reception_cash_by_local_payment_day_and_tenant
      - name: Validar registros FDI, periodontia, autorização e criptografia
        run: python -m pytest -q tests/unit/test_dental_clinic_unit.py tests/unit/test_dental_clinic_release.py tests/unit/test_start_api.py tests/unit/test_plan_permissions.py tests/unit/test_dental_workspace_context.py tests/unit/test_barbershop_layout_modes.py
      - name: Instalar DOM isolado
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Testar a interface e regressões
        run: node --test ui-tests/dental-clinic.test.mjs ui-tests/dental-workspace.test.mjs ui-tests/dental-patient-journey.test.mjs ui-tests/customer-form.test.mjs ui-tests/professional-portal.test.mjs ui-tests/agenda-lifecycle.test.mjs ui-tests/dashboard-today-preview.test.mjs ui-tests/dashboard-finance-goals.test.mjs ui-tests/onboarding-dashboard-link.test.mjs
      - name: Validar recepção, ficha e estoque em celular, tablet e desktop
        env:
          ORION_TEST_CHROME: /usr/bin/google-chrome
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python ui-tests/dental-reception-browser.py
          python ui-tests/dental-visit-links-browser.py
          python ui-tests/dental-stock-browser.py
          python ui-tests/dental-directory-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: odontologia-recepcao-visual
          path: artifacts/dental-reception/
          retention-days: 14

  image:
    needs: clinic-validation
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/odontologia-revisao'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar e publicar a imagem de Odontologia
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          tag="$IMAGE:dental-$RELEASE_SHA"
          docker build --pull --platform linux/amd64 -f deploy/Dockerfile.dental-workflows --build-arg ORION_DENTAL_COMMIT="$RELEASE_SHA" -t "$tag" .
          docker run --rm --entrypoint python "$tag" -c 'from app.dental_clinic_api import router; from scripts.backup_and_migrate_dental_workflows import TARGET; assert len(router.routes) > 20 and TARGET == "0087_dental_patient_visits"'
          docker run --rm --entrypoint python "$tag" -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; assert ScriptDirectory.from_config(Config("alembic.ini")).get_current_head() == "0087_dental_patient_visits"'
          docker push "$tag"
          docker image inspect "$tag" --format '{{index .RepoDigests 0}}' > dental-release-image.txt
          printf '%s\n' "$RELEASE_SHA" >> dental-release-image.txt
          cat dental-release-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dental-release-image
          path: dental-release-image.txt
          retention-days: 7
