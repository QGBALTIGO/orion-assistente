name: Orion - editor do expediente semanal
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/catalog_api.py'
      - 'app/static/orion-suite.js'
      - 'app/static/orion-suite.css'
      - 'ui-tests/orion-hours.test.mjs'
      - 'tests/integration/test_weekly_hour_edit_pg.py'
      - 'tests/e2e/test_hours_responsive.py'
      - '.github/workflows/orion-hours-editor.yml'
  push:
    branches: [main]
    paths:
      - 'app/catalog_api.py'
      - 'app/static/orion-suite.js'
      - 'app/static/orion-suite.css'
      - 'ui-tests/orion-hours.test.mjs'
      - 'tests/integration/test_weekly_hour_edit_pg.py'
      - 'tests/e2e/test_hours_responsive.py'
      - '.github/workflows/orion-hours-editor.yml'
permissions:
  contents: read
jobs:
  ui:
    name: Cards, form editing and mobile-safe weekly ordering
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked DOM dependencies
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript and weekly schedule workflows
        run: |
          node --check app/static/orion-suite.js
          node --test ui-tests/orion-hours.test.mjs
  browser:
    name: Real iPhone WebKit, tablet and desktop visual sizing
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser runners
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Verify days, editing and overflow on actual engines
        run: python -m pytest -q -ra tests/e2e/test_hours_responsive.py
  postgres:
    name: Real PostgreSQL 16 scoped hour and break editing
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: synthetic-working-hours-strong-token-20261026
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application and test dependencies
        run: |
          python -m pip install -c requirements.lock '.[test]'
          python -m pip check
          python -m py_compile app/catalog_api.py tests/integration/test_weekly_hour_edit_pg.py
      - name: Create isolated tenant roles and schema
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade head
      - name: Validate shift and pause updates, collisions, tenant permissions
        run: python -m pytest -q -ra tests/integration/test_weekly_hour_edit_pg.py tests/integration/test_catalog.py
