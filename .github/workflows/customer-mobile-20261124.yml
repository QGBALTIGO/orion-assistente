name: Orion - Responsividade da area do cliente
on:
  push:
    branches: [codex/orion-customer-mobile-20261124]
    paths:
      - 'app/static/orion-customer-area.css'
      - 'tests/e2e/browser_public_customer_mobile.py'
      - 'Dockerfile.customer-mobile-overlay'
      - '.github/workflows/customer-mobile-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  browser:
    name: iPhone WebKit, Android Chromium, tablet e desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --init
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: python -m pip install -r tests/e2e/requirements.txt pytest
      - name: Validar geometria, erro de login e fluxos existentes
        run: python -m pytest -q -ra tests/e2e/browser_public_customer_mobile.py tests/e2e/browser_public_customer_area.py tests/e2e/browser_public_cache_profile.py
  image:
    name: Imagem candidata, somente CSS da area do cliente
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:customer-mobile-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guardar CSS da versao publicada
        run: |
          mkdir -p .ci-baseline
          git show ef62423c67202bae59088ce14500d9f65a65a978:app/static/orion-customer-area.css > .ci-baseline/orion-customer-area.css
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preservar imagem de producao e validar cache por versao
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile.customer-mobile-overlay -t "$IMAGE" .
          docker run --rm --user root -v "$PWD/tests:/srv/app/tests:ro" "$IMAGE" python -m pytest -q -ra tests/unit/test_public_customer_area.py tests/unit/test_public_site_asset_cache.py
      - name: Publicar imagem candidata
        run: docker push "$IMAGE"
