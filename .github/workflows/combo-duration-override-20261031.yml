name: Orion - duracao personalizada de combos

on:
  push:
    branches: [security/prelaunch-hardening-20261030]
    paths:
      - 'app/service_packages_api.py'
      - 'app/static/orion-suite.js'
      - 'alembic/versions/0055_combo_duration_override.py'
      - 'scripts/backup_and_migrate_combo_duration.py'
      - 'tests/integration/test_combo_duration_override_pg.py'
      - 'tests/unit/test_combo_duration_*.py'
      - 'ui-tests/package-variable-combo.test.mjs'
      - '.github/workflows/combo-duration-override-20261031.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/service_packages_api.py'
      - 'app/static/orion-suite.js'
      - 'alembic/versions/0055_combo_duration_override.py'
      - 'scripts/backup_and_migrate_combo_duration.py'
      - 'tests/integration/test_combo_duration_override_pg.py'
      - 'tests/unit/test_combo_duration_*.py'
      - 'ui-tests/package-variable-combo.test.mjs'
      - '.github/workflows/combo-duration-override-20261031.yml'

permissions:
  contents: read

jobs:
  combo-ui:
    name: Formulario automatico e duracao personalizada
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar JS e fluxos de criar/editar/restaurar
        run: |
          node --check app/static/orion-suite.js
          node --test ui-tests/package-variable-combo.test.mjs ui-tests/package-cards-compact.test.mjs

  combo-postgres:
    name: PostgreSQL 16, RLS, agendamento e snapshot do combo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      REQUIRE_POSTGRES_TESTS: '1'
      BUSINESS_PROFILES_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias e sintaxe
        run: |
          python -m pip install -c requirements.lock '.[test]'
          python -m pip check
          python -m compileall -q app scripts alembic tests/integration/test_combo_duration_override_pg.py
      - name: Instalar esquemas e RLS em base sintetica
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade head
          python -m alembic current --check-heads
      - name: Validar modo automatico, personalizado, extras e agendamentos existentes
        run: |
          python -m pytest -q -ra \
            tests/unit/test_combo_duration_release.py \
            tests/unit/test_combo_duration_models.py \
            tests/integration/test_combo_duration_override_pg.py
