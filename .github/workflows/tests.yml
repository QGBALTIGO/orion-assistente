name: FATIA 0 - testes PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install ".[test]"
      - name: Provisionar papéis separados
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -f infra/postgres/init/001-roles.sql
      - name: Aplicar migration
        run: alembic upgrade head
      - name: Rodar suite incluindo RLS real
        run: pytest -q -ra
      - name: Validar build Docker, Compose e health HTTP
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          APP_RUNTIME_PASSWORD: ci-runtime-only
          APP_MIGRATOR_PASSWORD: ci-migrator-only
        run: |
          docker compose config --quiet
          docker build -t orion-barbearias:fatia0 .
          docker compose up -d postgres redis
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm test
          docker compose up -d api worker
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/health
