name: FATIA 0 e 1 - PostgreSQL e Docker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install ".[test]"
      - name: Validar sintaxe do serviço privado de transcrição
        run: python -m py_compile qr-transcriber/app.py
      - name: Provisionar papéis separados
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
      - name: Aplicar migration
        run: alembic upgrade head
      - name: Testar pg_dump/restore em banco efêmero
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          pg_dump -h localhost -U postgres -d barber_saas -Fc -f /tmp/orion-smoke.dump
          createdb -h localhost -U postgres orion_restore
          pg_restore -h localhost -U postgres -d orion_restore --no-owner --no-acl --exit-on-error /tmp/orion-smoke.dump
          test "$(psql -h localhost -U postgres -d orion_restore -tAc 'SELECT count(*) FROM alembic_version')" = "1"
          dropdb -h localhost -U postgres orion_restore
          rm -f /tmp/orion-smoke.dump
      - name: Rodar suite incluindo RLS real
        run: pytest -q -ra
      - name: Validar build Docker, Compose e health HTTP
        env:
          POSTGRES_PASSWORD: ci-postgres-only
          APP_RUNTIME_PASSWORD: ci-runtime-only
          APP_MIGRATOR_PASSWORD: ci-migrator-only
          APP_SUPPORT_PASSWORD: ci-support-only
          SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
        run: |
          docker compose config --quiet
          docker build -t orion-barbearias:fatia0 .
          docker compose up -d --wait postgres redis
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -v db_name="$POSTGRES_DB" -v support_password="$APP_SUPPORT_PASSWORD" -f /etc/orion/upgrade-support.sql'
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm test
          docker compose up -d api worker
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/health


  faster_whisper:
    name: ASR faster-whisper - CPU, Docker e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ASR dependencies
        run: python -m pip install -r qr-transcriber/requirements.txt pytest httpx
      - name: Unit and API tests
        run: cd qr-transcriber && python -m pytest -q test_app.py
      - name: Build real inference image
        run: docker build -t orion-faster-whisper:ci qr-transcriber
      - name: Synthetic speech smoke test
        run: bash qr-transcriber/ci-smoke.sh

  qr_bridge:
    name: QR bridge — Node, IPv6, segurança e Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxe Node do conector
        run: |
          node --check qr-bridge/src/server.mjs
          node --check qr-bridge/src/core.mjs
      - name: Suite de telefone, pareamento, LID e IPv6
        run: node --test qr-bridge/test/*.test.mjs
      - name: Build da imagem real Node Baileys
        run: docker build -f qr-bridge/Dockerfile -t orion-qr:ci qr-bridge

      - name: Smoke test real Baileys + mensagem gerada e cache cifrado no contêiner
        run: |
          docker run --rm orion-qr:ci node --input-type=module -e '
            import assert from "node:assert/strict";
            import pino from "pino";
            import {generateWAMessage,generateMessageIDV2,BufferJSON} from "@whiskeysockets/baileys";
            import {makeEncryptedRetryStore} from "./src/encrypted-retry-store.mjs";
            import {sendStoredText} from "./src/reliable-send.mjs";
            const from="5521999999999@s.whatsapp.net";
            const to="5521888888888@s.whatsapp.net";
            const logger=pino({level:"silent"});
            const message=await generateWAMessage(to,{text:"Mensagem sintética CI"},{
              userJid:from,logger,messageId:generateMessageIDV2(from)});
            assert.ok(message.key.id && message.message);
            const cache=makeEncryptedRetryStore({
              directory:"/data/ci-encrypted-retry",
              secret:"ci-only-cryptographic-key-0123456789-do-not-use",
              serialize:x=>JSON.stringify(x,BufferJSON.replacer),
              deserialize:x=>JSON.parse(x,BufferJSON.reviver)});
            let relays=0;
            await sendStoredText({jid:to,text:"Mensagem sintética CI",store:cache,
              makeMessage:async()=>message,
              relay:async(dest,msg,opts)=>{
                relays++;
                assert.equal(JSON.stringify(cache.get({id:opts.messageId}),BufferJSON.replacer),JSON.stringify(message.message,BufferJSON.replacer));
                assert.deepEqual(msg,message.message);
                assert.equal(dest,to);
              }});
            assert.equal(relays,1);
            assert.equal(JSON.stringify(cache.get({id:message.key.id}),BufferJSON.replacer),JSON.stringify(message.message,BufferJSON.replacer));
            console.log("ORION_BAILEYS_REAL_PACKAGE_DRY_RUN_OK");
          '

      - name: Verificar cache de retry com biblioteca real no contêiner
        run: |
          docker run --rm orion-qr:ci node --input-type=module -e '
            import assert from "node:assert/strict";
            import NodeCache from "@cacheable/node-cache";
            const counter=new NodeCache({stdTTL:600,checkperiod:120,useClones:false});
            counter.set("synthetic-id",1);
            assert.equal(counter.get("synthetic-id"),1);
            counter.flushAll();
            assert.equal(counter.get("synthetic-id"),undefined);
            console.log("ORION_BAILEYS_RETRY_CACHE_OK");
            counter.close?.();
            process.exit(0);
          '
