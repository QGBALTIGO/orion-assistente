name: Orion - authenticated Hostinger ingress

on:
  push:
    branches: [codex/orion-hostinger-ingress-20261104, security/prelaunch-hardening-20261030]
    paths:
      - 'app/ingress.py'
      - 'app/main.py'
      - 'tests/unit/test_authenticated_ingress.py'
      - '.github/workflows/authenticated-ingress.yml'
  pull_request:
    paths:
      - 'app/ingress.py'
      - 'app/main.py'
      - 'tests/unit/test_authenticated_ingress.py'
      - '.github/workflows/authenticated-ingress.yml'

permissions:
  contents: read

jobs:
  ingress-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_DATABASE_URL: postgresql+asyncpg://test_runtime:test_only@127.0.0.1:65432/test_ingress
      REDIS_URL: redis://127.0.0.1:6399/15
      GROQ_PROBE_ON_START: '0'
      META_LIVE_SEND: '0'
      PANEL_EMAIL_LIVE_SEND: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the existing locked dependencies
        run: |
          python -m pip install -c requirements.lock '.[test]'
          python -m pip check
      - name: Verify authenticated metadata and existing public contracts
        run: |
          python -m pytest -q tests/unit/test_authenticated_ingress.py tests/unit/test_public_site.py tests/unit/test_public_domain.py tests/unit/test_sales_requests_unit.py
