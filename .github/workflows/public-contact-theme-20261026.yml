name: Orion - contatos e temas do site publico

on:
  push:
    branches: [main]
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public-theme.js'
      - 'app/static/orion-public.css'
      - 'app/public_site_api.py'
      - 'ui-tests/public-contact-theme.test.mjs'
      - 'tests/e2e/browser_public_contact_theme.py'
      - '.github/workflows/public-contact-theme-20261026.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public-theme.js'
      - 'app/static/orion-public.css'
      - 'app/public_site_api.py'
      - 'ui-tests/public-contact-theme.test.mjs'
      - 'tests/e2e/browser_public_contact_theme.py'

permissions:
  contents: read

jobs:
  contact-and-theme-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Syntax and DOM contact/theme tests
        run: |
          node --check app/static/orion-public.js
          node --check app/static/orion-public-theme.js
          node --test ui-tests/public-contact-theme.test.mjs ui-tests/orion-public.test.mjs ui-tests/public-hero-actions.test.mjs

  contact-and-theme-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Check icons, accessibility, light/dark/system and overflow
        run: python -m pytest -q -ra tests/e2e/browser_public_contact_theme.py tests/e2e/browser_public_hero_actions.py
