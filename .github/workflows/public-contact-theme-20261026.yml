name: Orion - contatos por icones e aparencia do site

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.css'
      - 'app/static/orion-public.js'
      - 'ui-tests/public-harness.mjs'
      - 'ui-tests/public-contact-theme.test.mjs'
      - 'tests/e2e/browser_public_contact_theme.py'
      - '.github/workflows/public-contact-theme-20261026.yml'

permissions:
  contents: read

jobs:
  social-contact-and-theme:
    name: SVG de contato, preferencia Claro Escuro Sistema e regressao
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias travadas para UI
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Conferir DOM, seguranca, agendamentos, mapas e configuracoes
        run: |
          node --check app/static/orion-public.js
          node --test \
            ui-tests/public-contact-theme.test.mjs \
            ui-tests/public-location-hours.test.mjs \
            ui-tests/public-hero-actions.test.mjs \
            ui-tests/orion-public.test.mjs

  mobile-desktop:
    name: Safari WebKit e Chromium - 320, 375, 390, 768 e 1024px
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegadores isolados
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Testar layout, contraste, temas e icones
        run: python -m pytest -q -ra tests/e2e/browser_public_contact_theme.py tests/e2e/browser_public_hero_actions.py
