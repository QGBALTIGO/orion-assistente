name: Orion - Logo e controles do cabecalho
on:
  push:
    branches: [codex/orion-header-layout-20261124]
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-customer-area.css'
      - 'Dockerfile.header-layout-overlay'
      - '.github/workflows/header-layout-20261124.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Regressao mobile da area do cliente
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      options: --init
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias sem baixar navegadores
        run: python -m pip install -r tests/e2e/requirements.txt pytest
      - name: Testar os cenarios mobile existentes
        run: python -m pytest -q -ra tests/e2e/browser_public_customer_mobile.py
  image:
    name: Publicar overlay somente apos os testes
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:header-layout-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar baseline exato da producao
        run: |
          set -euo pipefail
          BASELINE_COMMIT=9f33fcc05772d557e75ed50d57c703959334e77e
          for path in app/static/orion-public.html app/static/orion-customer-area.css; do
            mkdir -p ".ci-baseline/$(dirname "$path")"
            git show "$BASELINE_COMMIT:$path" > ".ci-baseline/$path"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e conferir os arquivos da imagem
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f Dockerfile.header-layout-overlay -t "$IMAGE" .
          container_id=$(docker create "$IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/srv/app/app/static/orion-public.html" /tmp/orion-public-reviewed.html
          docker cp "$container_id:/srv/app/app/static/orion-customer-area.css" /tmp/orion-customer-area-reviewed.css
          cmp app/static/orion-public.html /tmp/orion-public-reviewed.html
          cmp app/static/orion-customer-area.css /tmp/orion-customer-area-reviewed.css
      - name: Publicar imagem candidata sem alterar Railway
        run: docker push "$IMAGE"
