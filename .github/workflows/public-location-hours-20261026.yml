name: Orion - site publico, horarios e Google Maps

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/public_site_api.py'
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-harness.mjs'
      - 'ui-tests/public-location-hours.test.mjs'
      - 'ui-tests/orion-public.test.mjs'
      - 'ui-tests/public-hero-actions.test.mjs'
      - 'tests/unit/test_public_opening_hours.py'
      - 'tests/integration/test_public_hours_live.py'
      - 'tests/e2e/browser_public_hero_actions.py'
      - '.github/workflows/public-location-hours-20261026.yml'

permissions:
  contents: read

jobs:
  public-page-ui:
    name: Public site, weekly schedule and safe Maps links
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked front-end test dependencies
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Test opening hours, map, routing, bookings and share
        run: |
          node --check app/static/orion-public.js
          node --test \
            ui-tests/public-location-hours.test.mjs \
            ui-tests/orion-public.test.mjs \
            ui-tests/public-hero-actions.test.mjs

  browsers:
    name: Real WebKit and Chromium mobile and desktop layout
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser fixtures
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Check map iframe sizing, schedules and mobile navigation
        run: python -m pytest -q -ra tests/e2e/browser_public_hero_actions.py

  postgres:
    name: PostgreSQL 16 public team schedule and tenant isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: synthetic-public-hours-test-support-token-123456
      REQUIRE_POSTGRES_TESTS: '1'
      BUSINESS_PROFILES_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application test dependencies
        run: |
          python -m pip install -c requirements.lock '.[test]'
          python -m pip check
          python -m compileall -q app tests/integration/test_public_hours_live.py
      - name: Create scoped database roles and schemas
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade head
      - name: Verify schedule merges, public APIs and existing bookings
        run: |
          python -m pytest -q -ra \
            tests/unit/test_public_opening_hours.py \
            tests/integration/test_public_hours_live.py \
            tests/integration/test_public_catalog.py
