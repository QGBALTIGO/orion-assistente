name: Orion - Troca de senha administrativa autenticada
on:
  push:
    branches: [codex/admin-password-self-service-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      BASE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:1496b14ed8af7871487ea41d14ce391843d012f75082223595fe44f62c62145f
      IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:admin-personal-password-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir sobre a imagem publicada
        run: |
          docker pull "$BASE"
          docker build --build-arg BASE_IMAGE="$BASE" --build-arg ORION_RELEASE="$GITHUB_SHA" -f deploy/Dockerfile.admin-personal-password -t "$IMAGE" .
          test "$(docker image inspect --format '{{.Config.User}}' "$BASE")" = "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          test "$(docker image inspect --format '{{json .Config.Cmd}}' "$BASE")" = "$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")"
          docker run --rm --entrypoint python "$IMAGE" -m py_compile app/legacy_admin_password.py app/panel_auth.py app/account_auth.py scripts/backup_and_migrate_admin_personal_password.py
          docker run --rm --entrypoint sh "$IMAGE" -c 'grep -R -n --include="*.py" "_password_valid" app/ | cut -c1-220'
      - name: Validar autenticação com PostgreSQL e Redis isolados
        run: |
          docker run --rm --network host -e ORION_TEST_ADMIN_POSTGRES=postgresql://postgres:ci-only-test-password@127.0.0.1:5432/postgres -e ORION_TEST_ADMIN_REDIS=redis://127.0.0.1:6379/15 -v "$GITHUB_WORKSPACE/tests/integration/test_admin_personal_password.py:/tmp/test_admin_personal_password.py:ro" --entrypoint python "$IMAGE" -m pytest -q /tmp/test_admin_personal_password.py -o asyncio_mode=auto
      - name: Validar interface e regressão da conta
        run: |
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/srv/app/app/static/." app/static/
          docker rm "$cid"
          node --check app/static/orion-admin-center.js
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --test --test-reporter=spec ui-tests/admin-personal-password.test.mjs ui-tests/member-account-settings.test.mjs ui-tests/admin-only-operator-navigation.test.mjs
      - name: Publicar imagem validada no GHCR
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | tee admin-personal-password-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: admin-personal-password-image
          path: admin-personal-password-image.txt
