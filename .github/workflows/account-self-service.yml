name: Orion - Minha conta e dados da empresa
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/account_auth.py'
      - 'app/account_settings.py'
      - 'app/main.py'
      - 'app/static/panel.html'
      - 'ui-tests/member-account-settings.test.mjs'
      - 'tests/integration/test_account_self_service.py'
      - '.github/workflows/account-self-service.yml'
permissions:
  contents: read
jobs:
  dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - run: node --test ui-tests/member-account-settings.test.mjs
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock ".[test]"
      - name: Provisionar papéis isolados
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
      - run: alembic upgrade head
      - run: pytest -q -ra tests/integration/test_account_self_service.py
