name: Orion - Administração de clientes
on:
  pull_request:
    paths:
      - 'app/admin_accounts.py'
      - 'app/account_auth.py'
      - 'app/static/panel.html'
      - 'app/static/orion-suite.js'
      - 'alembic/versions/0042_admin_account_controls.py'
      - 'scripts/backup_and_migrate_admin_accounts.py'
      - 'scripts/backup_and_migrate_registration.py'
      - 'tests/unit/test_admin_accounts.py'
      - '.github/workflows/admin-client-accounts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements.lock '.[test]'
      - run: python -m pytest -q tests/unit/test_admin_accounts.py
      - run: python -m compileall -q app/admin_accounts.py app/account_auth.py scripts/backup_and_migrate_admin_accounts.py
  browser-dom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - run: node --test ui-tests/admin-only-operator-navigation.test.mjs ui-tests/dashboard-navigation.test.mjs
