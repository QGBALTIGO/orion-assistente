name: Orion - navegacao Ferramentas (DOM rapido)
on:
  pull_request:
    paths:
      - 'app/static/orion-suite.js'
      - 'ui-tests/subscription-sidebar-spacing.test.mjs'
      - '.github/workflows/subscription-tools-navigation.yml'
permissions:
  contents: read
concurrency:
  group: orion-tools-menu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  menu-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      INBOX_SEND_ENABLED: '0'
      MARKETING_EXECUTION_ENABLED: '0'
      CAKTO_BILLING_LIVE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de teste da interface
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Sintaxe, unicidade, secoes, permissao e regressao
        run: |
          node --check app/static/orion-suite.js
          node --test ui-tests/subscription-sidebar-spacing.test.mjs ui-tests/subscription-workspace.test.mjs ui-tests/single-business-context.test.mjs
