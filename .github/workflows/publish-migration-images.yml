name: Publish exact Orion migration images

on:
  push:
    branches: [codex/railway-gabi-images-20261114]
    paths: [.github/workflows/publish-migration-images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: orion-migration-images
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            revision: 0f1896d402060053a9eb07cafabd867077a8de37
            context: .
            image: ghcr.io/qgbaltigo/orion-assistente-api
          - component: qr-bridge
            revision: 23e2f40bef9b9594586d64f4d2736212025ade51
            context: qr-bridge
            image: ghcr.io/qgbaltigo/orion-assistente-qr-bridge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Verify exact production source
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Sign in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build exact source without production credentials
        env:
          IMAGE: ${{ matrix.image }}
          REVISION: ${{ matrix.revision }}
          CONTEXT: ${{ matrix.context }}
        run: |
          docker build --pull \
            --label org.opencontainers.image.source=https://github.com/QGBALTIGO/orion-assistente \
            --label org.opencontainers.image.revision="$REVISION" \
            --label org.opencontainers.image.description="Orion runtime built from the verified production revision" \
            -t "$IMAGE:$REVISION" "$CONTEXT"
      - name: Check runtime and push immutable revision tag
        env:
          IMAGE: ${{ matrix.image }}
          REVISION: ${{ matrix.revision }}
          COMPONENT: ${{ matrix.component }}
        run: |
          if [ "$COMPONENT" = api ]; then
            docker run --rm --entrypoint python "$IMAGE:$REVISION" -m pip check
            docker run --rm --entrypoint pg_dump "$IMAGE:$REVISION" --version
          else
            docker run --rm --entrypoint node "$IMAGE:$REVISION" --check src/server.mjs
          fi
          docker push "$IMAGE:$REVISION"
          docker image inspect "$IMAGE:$REVISION" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry login
        if: always()
        run: docker logout ghcr.io
