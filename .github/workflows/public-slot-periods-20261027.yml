name: Orion - agendamento por manha tarde noite

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-slot-periods.test.mjs'
      - 'tests/e2e/browser_public_slot_periods.py'
      - '.github/workflows/public-slot-periods-20261027.yml'
  push:
    branches: [main]
    paths:
      - 'app/static/orion-public.js'
      - 'app/static/orion-public.css'
      - 'ui-tests/public-slot-periods.test.mjs'
      - 'tests/e2e/browser_public_slot_periods.py'
      - '.github/workflows/public-slot-periods-20261027.yml'

permissions:
  contents: read

jobs:
  dom:
    name: DOM, periodos, fuso, selecao e regressao de reserva
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias travadas
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Verificar sintaxe e reserva
        run: |
          node --check app/static/orion-public.js
          node --test \
            ui-tests/public-slot-periods.test.mjs \
            ui-tests/public-professional-smooth.test.mjs \
            ui-tests/public-multiservice.test.mjs \
            ui-tests/orion-public.test.mjs

  chrome-fast:
    name: Chrome em celular tablet e desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia Playwright sem navegador extra
        run: |
          google-chrome --version
          python -m pip install -r tests/e2e/requirements.txt pytest
      - name: Verificar grade e agendamento pelo Chrome instalado
        env:
          ORION_PUBLIC_TEST_CHROME: '1'
        run: python -m pytest -q -ra tests/e2e/browser_public_slot_periods.py -k chromium

  webkit:
    name: Safari WebKit no iPhone e Chromium responsivo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegadores reais
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Validar seis combinacoes de largura tema e periodo
        run: python -m pytest -q -ra tests/e2e/browser_public_slot_periods.py
