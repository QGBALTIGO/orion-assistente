name: Orion plan control validation
on:
  push:
    branches: [feature/plan-control-20261103]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o /tmp/orion-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: orion-plan-control-source
          path: /tmp/orion-source.tar.gz
          retention-days: 1
