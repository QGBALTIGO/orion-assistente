name: Orion - Correção do alinhamento dos filtros Delivery
on:
  push:
    branches: [codex/delivery-filter-alignment-20261128]
permissions:
  contents: read
  packages: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d barber_saas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      REDIS_URL: redis://localhost:6379/15
      SUPPORT_API_TOKEN: synthetic-delivery-test-token-never-use-in-production
      REQUIRE_POSTGRES_TESTS: '1'
      ORION_DELIVERY_BROWSER_TEST: '1'
      ORION_DELIVERY_WEBKIT_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Conciliar mudanças com a imagem real de produção
        run: python scripts/package_delivery_filter_fix.py prepare
      - name: Preparar banco descartável e navegadores
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          python -m pip install -c requirements.lock '.[test]' -r tests/e2e/requirements.txt
          python -m pip check
          python -m playwright install --with-deps chromium webkit
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 -v db_name=barber_saas -v runtime_password=ci-runtime-only -v migrator_password=ci-migrator-only -v support_password=ci-support-only -f infra/postgres/init/001-roles.sql
          alembic upgrade head
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Validar ações dos filtros e componentes Delivery
        run: |
          node --check app/static/orion-delivery-orders.js
          node --check app/static/orion-delivery-catalog.js
          node --test --test-reporter=spec ui-tests/delivery-dashboard-v2.test.mjs ui-tests/delivery-catalog.test.mjs ui-tests/delivery-reports.test.mjs ui-tests/delivery-workspace-v2.test.mjs ui-tests/delivery-order-containers.test.mjs ui-tests/delivery-logistics.test.mjs
      - name: Painel real em Chromium e WebKit
        run: pytest -q -ra tests/integration/test_delivery_catalog_postgres.py -k catalog_in_real_panel_at_required_widths
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-filter-fix-browser
          path: artifacts/delivery-browser/*.png
      - name: Empacotar os três arquivos testados sobre produção
        env:
          IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:delivery-filter-fix-${{ github.sha }}
        run: python scripts/package_delivery_filter_fix.py "$IMAGE" "$GITHUB_SHA"
      - name: Publicar imagem homologada sem atualizar o Railway
        env:
          IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:delivery-filter-fix-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" =~ ^ghcr\.io/qgbaltigo/orion-assistente-api@sha256:[a-f0-9]{64}$ ]]
          printf 'RepoDigest=%s\n' "$digest" | tee filter-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-filter-fix-image
          path: filter-image.txt
