name: Orion - Conexões e destinos de Afiliados
on:
  push:
    branches: ['codex/afiliados-conexoes-20261125*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      API_BASE: ghcr.io/qgbaltigo/orion-assistente-api@sha256:7b3ed490f46910a3a950aea12f02ea04513da779b4c12ac0f2f432218c731287
      API_IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:affiliate-connections-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preservar a versão atual de produção e conferir arquivos-base
        run: |
          docker run --rm --entrypoint python "$API_BASE" -c '
          import hashlib
          from pathlib import Path
          expected = {
            "orion-affiliate-workspace.js": "286267187f37d785d54395cad3fb42a37077b468692ef47b4fcf7f727430896d",
            "orion-affiliate-workspace.css": "26672e6d05fc194876bb80902f137d697415e6c19c5efa1a09b8d62324416b73",
          }
          for name,digest in expected.items():
            assert hashlib.sha256(Path("app/static", name).read_bytes()).hexdigest()==digest, name
          print("Base dos Afiliados conferida.")
          '
          docker run --rm --entrypoint cat "$API_BASE" /srv/app/app/static/orion-suite.js > base-suite.js
          python - <<'PY'
          import re
          from pathlib import Path
          source=Path("base-suite.js").read_text()
          pattern=r"(/api/v1/afiliados-assets/workspace\.(?:js|css)\?v=)[^'\"]+"
          patched,n=re.subn(pattern,lambda m:m.group(1)+"af-conexoes-20261125",source)
          assert n==2,n
          Path("app/static/orion-suite.js").write_text(patched)
          print("Somente as duas versões de cache foram atualizadas no painel publicado.")
          PY
      - name: Validar conexões e regressões das demais abas
        run: |
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
          node --check app/static/orion-suite.js
          node --input-type=module --check < app/static/orion-affiliate-workspace.js
          node --test --test-reporter=spec ui-tests/affiliate-connections.test.mjs ui-tests/affiliate-history.test.mjs ui-tests/affiliate-automations.test.mjs ui-tests/affiliate-offers.test.mjs ui-tests/affiliate-dashboard.test.mjs ui-tests/affiliate-dashboard-updates.test.mjs
      - name: Conferir layout e navegação em Chromium e WebKit
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
          python ui-tests/affiliate-connections-layout.py --engine chromium
          python ui-tests/affiliate-connections-layout.py --engine webkit --widths 320 430 --themes dark
          python ui-tests/affiliate-connections-layout.py --engine chromium --widths 430 --themes dark --layouts app --states empty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: affiliate-connections-browser
          path: artifacts/affiliate-connections/
      - name: Construir e conferir atualização somente da interface
        run: |
          docker build -f deploy/Dockerfile.affiliate-history --build-arg BASE_IMAGE="$API_BASE" --build-arg ORION_RELEASE="$GITHUB_SHA" -t "$API_IMAGE" .
          docker run --rm --entrypoint python -v "$GITHUB_WORKSPACE/app/static:/review:ro" "$API_IMAGE" -c '
          from pathlib import Path
          import hashlib
          for name in ("orion-suite.js", "orion-affiliate-workspace.js", "orion-affiliate-workspace.css"):
            data=Path("app/static", name).read_bytes()
            assert data == Path("/review", name).read_bytes(), name
            print(name,hashlib.sha256(data).hexdigest())
          '
          docker push "$API_IMAGE"
          docker image inspect "$API_IMAGE" --format '{{index .RepoDigests 0}}' > affiliate-connections-api-image.txt
          cat affiliate-connections-api-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-connections-image
          path: affiliate-connections-api-image.txt
