name: Orion - verificador WhatsApp (etapa 18)
on:
  pull_request:
    paths:
      - 'app/subscription_number_check*.py'
      - 'app/static/orion-subscription-number-check.js'
      - 'qr-bridge/src/device-number-check.mjs'
      - 'qr-bridge/test/device-number-check.test.mjs'
      - 'qr-bridge/src/channel-routes.mjs'
      - 'qr-bridge/src/channel-manager.mjs'
      - 'qr-bridge/src/channel-session.mjs'
      - 'app/plan_catalog.py'
      - 'app/plan_routing.py'
      - 'app/workspace_policy.py'
      - 'app/main.py'
      - 'app/static/orion-suite.js'
      - 'app/static/panel.html'
      - 'tests/unit/test_subscription_number_check*.py'
      - 'ui-tests/subscription-number-check.test.mjs'
      - '.github/workflows/subscription-number-check.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  QR_CHANNELS_ENABLED: '0'
  META_LIVE_SEND: '0'
  INBOX_SEND_ENABLED: '0'
  MARKETING_EXECUTION_ENABLED: '0'
  QR_NATIVE_TEST_ENABLED: '0'
  PYTHONUTF8: '1'
jobs:
  read-only-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm ci --prefix qr-bridge --ignore-scripts --no-audit --no-fund
      - name: Syntax of shipped assets and existing session entrypoints
        run: |
          node --check qr-bridge/src/device-number-check.mjs
          node --check qr-bridge/src/channel-manager.mjs
          node --check qr-bridge/src/channel-session.mjs
          node --check qr-bridge/src/channel-routes.mjs
          node --check app/static/orion-subscription-number-check.js
          node --check app/static/orion-suite.js
      - name: Read-only verifier and existing group/session regressions
        run: |
          node --test qr-bridge/test/device-number-check.test.mjs
          node --test qr-bridge/test/device-group-contacts.test.mjs
      - name: Ensure transport has no mutation path added to verifier
        run: |
          if grep -E 'sendMessage\\(|relayMessage\\(|groupParticipantsUpdate\\(|logout\\(' qr-bridge/src/device-number-check.mjs; then exit 1; fi
  orion-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Synthetic no-send DOM tests for stage 18
        run: node --test ui-tests/subscription-number-check.test.mjs
  api-and-permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: Install pinned test dependencies
        run: python -m pip install -c requirements.lock '.[test]'
      - name: Strict schema, workspace and path tests
        run: python -m pytest -q tests/unit/test_subscription_number_check.py tests/unit/test_subscription_number_check_api.py
      - name: Python source syntax
        run: python -m compileall -q app/subscription_number_check.py app/subscription_number_check_schemas.py app/main.py app/plan_routing.py
