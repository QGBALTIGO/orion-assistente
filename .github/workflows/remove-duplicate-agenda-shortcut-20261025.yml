name: Orion — remover card duplicado Ver agenda
on:
  push:
    branches: [codex/remove-duplicate-view-agenda-shortcut-20261025]
    paths:
      - 'app/static/orion-suite.js'
      - 'ui-tests/dashboard-navigation.test.mjs'
      - 'scripts/prepare_vercel_orion.py'
      - '.github/workflows/remove-duplicate-agenda-shortcut-20261025.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Conferir sintaxe
        run: node --check app/static/orion-suite.js
      - name: Regressões focadas Dashboard e prévia Agenda de hoje
        run: node --test ui-tests/dashboard-navigation.test.mjs ui-tests/dashboard-today-preview.test.mjs ui-tests/vercel-facade.test.mjs
      - name: Regressões DOM completas
        run: npm test --prefix ui-tests
      - name: Conferir integridade do pacote Vercel
        run: python3 scripts/prepare_vercel_orion.py --output /tmp/orion-dashboard-cleanup-release
