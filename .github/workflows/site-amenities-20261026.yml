name: Orion - site publico comodidades

on:
  push:
    branches: [main]
    paths:
      - 'app/static/orion-public.*'
      - 'app/static/orion-suite.*'
      - 'app/public_site_api.py'
      - 'app/management_schemas.py'
      - 'app/management_models.py'
      - 'ui-tests/public-amenities.test.mjs'
      - 'tests/e2e/browser_public_amenities.py'
      - '.github/workflows/site-amenities-20261026.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.*'
      - 'app/static/orion-suite.*'
      - 'app/public_site_api.py'
      - 'app/management_schemas.py'
      - 'app/management_models.py'
      - 'ui-tests/public-amenities.test.mjs'
      - 'tests/e2e/browser_public_amenities.py'
      - '.github/workflows/site-amenities-20261026.yml'

permissions:
  contents: read

jobs:
  amenities-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript and public/management DOM
        run: |
          node --check app/static/orion-public.js
          node --check app/static/orion-suite.js
          node --test \
            ui-tests/public-amenities.test.mjs \
            ui-tests/orion-public.test.mjs \
            ui-tests/public-contact-theme.test.mjs

  amenities-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Browser layouts, optional state and accessibility
        run: python -m pytest -q -ra tests/e2e/browser_public_amenities.py tests/e2e/browser_public_contact_theme.py


  amenities-postgres:
    name: Persistência, rascunho e publicação com PostgreSQL real
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: test-support-ci-token-of-64-characters-000000000000000000000000000
      REQUIRE_POSTGRES_TESTS: "1"
      ORION_INTAKE_TEST_REDIS_URL: redis://localhost:6379/15
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências travadas
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
      - name: Cliente PG16 (mesma versão de produção)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Provisionar papéis isolados e aplicar 0035
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade head
          test "$(PGPASSWORD=ci-migrator-only psql -h localhost -U app_migrator -d barber_saas -tAc 'SELECT version_num FROM public.alembic_version')" = "0035_public_amenities"
      - name: Testar flags, publicação e isolamento entre prévia e snapshot
        run: |
          python -m pytest -q -ra tests/unit/test_management_unit.py -k public_amenities
          python -m pytest -q -ra tests/integration/test_public_catalog.py -k public_amenity_flags
