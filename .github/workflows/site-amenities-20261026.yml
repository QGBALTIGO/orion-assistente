name: Orion - site publico comodidades

on:
  push:
    branches: [main]
    paths:
      - 'app/static/orion-public.*'
      - 'app/static/orion-suite.*'
      - 'app/public_site_api.py'
      - 'app/management_schemas.py'
      - 'app/management_models.py'
      - 'ui-tests/public-amenities.test.mjs'
      - 'tests/e2e/browser_public_amenities.py'
      - '.github/workflows/site-amenities-20261026.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.*'
      - 'app/static/orion-suite.*'
      - 'app/public_site_api.py'
      - 'app/management_schemas.py'
      - 'app/management_models.py'
      - 'ui-tests/public-amenities.test.mjs'
      - 'tests/e2e/browser_public_amenities.py'
      - '.github/workflows/site-amenities-20261026.yml'

permissions:
  contents: read

jobs:
  amenities-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript and public/management DOM
        run: |
          node --check app/static/orion-public.js
          node --check app/static/orion-suite.js
          node --test \
            ui-tests/public-amenities.test.mjs \
            ui-tests/orion-public.test.mjs \
            ui-tests/public-contact-theme.test.mjs

  amenities-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps chromium webkit
      - name: Browser layouts, optional state and accessibility
        run: python -m pytest -q -ra tests/e2e/browser_public_amenities.py tests/e2e/browser_public_contact_theme.py
