name: Orion - cadastro e acesso dos entregadores
on:
  push:
    branches: [codex/delivery-courier-directory-20261128]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: orion-courier-directory
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d barber_saas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      REDIS_URL: redis://localhost:6379/15
      SUPPORT_API_TOKEN: synthetic-courier-test-token-never-use-in-production
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconciliar com a imagem publicada
        run: python scripts/package_courier_directory_release.py prepare
      - name: Banco descartavel e navegadores
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          python -m pip install -c requirements.lock '.[test]' -r tests/e2e/requirements.txt
          python -m pip check
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 -v db_name=barber_saas -v runtime_password=ci-runtime-only -v migrator_password=ci-migrator-only -v support_password=ci-support-only -f infra/postgres/init/001-roles.sql
          alembic upgrade head
          python -m playwright install --with-deps chromium webkit
          npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Cadastro, autorizacao, isolamento e regressao real
        run: |
          python -m compileall -q app
          pytest -q -ra tests/integration/test_delivery_courier_directory_postgres.py tests/integration/test_delivery_route_batches_postgres.py tests/integration/test_delivery_logistics_postgres.py tests/integration/test_delivery_orders_postgres.py tests/integration/test_delivery_payments_postgres.py
      - name: Menu, cadastro e navegacao dos nichos
        run: |
          node --check app/static/orion-suite.js
          node --check app/static/orion-delivery-logistics.js
          node --check app/static/orion-delivery-driver.js
          node --test --test-reporter=spec ui-tests/delivery-courier-directory.test.mjs ui-tests/delivery-logistics.test.mjs ui-tests/delivery-workspace-v2.test.mjs ui-tests/delivery-dashboard-v2.test.mjs
      - name: Primeiro acesso e modo entrega em Chromium e WebKit
        run: |
          python tests/e2e/driver_activation_browser.py
          python tests/e2e/driver_route_portal_browser.py
      - name: Construir exatamente os arquivos aprovados
        env:
          IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:courier-directory-${{ github.sha }}
        run: python scripts/package_courier_directory_release.py "$IMAGE" "$GITHUB_SHA"
      - name: Publicar imagem imutavel
        env:
          IMAGE: ghcr.io/qgbaltigo/orion-assistente-api:courier-directory-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          [[ "$digest" =~ ^ghcr\.io/qgbaltigo/orion-assistente-api@sha256:[a-f0-9]{64}$ ]]
          printf 'RepoDigest=%s\n' "$digest" | tee courier-directory-image.txt
