name: Orion - proporcao dos campos e botoes da confirmacao

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.css'
      - 'app/static/orion-public.js'
      - 'tests/e2e/browser_public_confirmation_sizing.py'
      - '.github/workflows/public-confirmation-sizing-20261027.yml'
  push:
    branches: [main]
    paths:
      - 'app/static/orion-public.html'
      - 'app/static/orion-public.css'
      - 'app/static/orion-public.js'
      - 'tests/e2e/browser_public_confirmation_sizing.py'
      - '.github/workflows/public-confirmation-sizing-20261027.yml'

permissions:
  contents: read

concurrency:
  group: confirmation-sizing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dom:
    name: Reserva, mascara e nascimento preservados
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - run: |
          node --test ui-tests/public-confirmation-clean.test.mjs ui-tests/orion-public.test.mjs ui-tests/public-slot-periods.test.mjs ui-tests/public-multiservice.test.mjs ui-tests/public-professional-smooth.test.mjs
  geometry:
    name: Dimensoes e capturas - ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar motor e dependencias fixados
        run: |
          python -m pip install -r tests/e2e/requirements.txt pytest
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Conferir alturas, larguras, datas e confirmacao
        run: python -m pytest -q -ra tests/e2e/browser_public_confirmation_sizing.py -k ${{ matrix.browser }}
      - name: Guardar capturas e medidas sem dados reais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmation-sizing-${{ matrix.browser }}
          path: test-artifacts/confirmation-sizing/
          if-no-files-found: warn
          retention-days: 7
