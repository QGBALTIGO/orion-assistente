name: Orion - arquivamento de profissionais (PostgreSQL real)
on:
  push:
    branches: [main]
    paths:
      - 'app/professional_commissions.py'
      - 'app/management_api.py'
      - 'app/static/orion-suite.js'
      - 'tests/integration/test_professional_archival_pg.py'
      - '.github/workflows/professional-archive.yml'
  pull_request:
    paths:
      - 'app/professional_commissions.py'
      - 'app/management_api.py'
      - 'app/static/orion-suite.js'
      - 'tests/integration/test_professional_archival_pg.py'
      - '.github/workflows/professional-archive.yml'
permissions:
  contents: read
jobs:
  postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: ci-support-only-token-more-than-32-characters
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install -c requirements.lock ".[test]"
      - name: Configurar PostgreSQL
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
      - name: Migrar banco isolado
        run: alembic upgrade head
      - name: Validar sintaxe e isolamento
        run: |
          python -m py_compile app/management_api.py app/professional_commissions.py tests/integration/test_professional_archival_pg.py
          pytest -q -ra tests/integration/test_professional_archival_pg.py
