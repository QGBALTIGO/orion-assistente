name: Orion - bateria completa de importacao BotBot

on:
  pull_request:
    paths:
      - 'app/subscription_chatbot_botbot.py'
      - 'app/subscription_chatbot_botbot_preflight.py'
      - 'tests/unit/test_subscription_chatbot_botbot_preflight.py'
      - 'tests/unit/test_subscription_chatbot_botbot.py'
      - '.github/workflows/chatbot-botbot-preflight.yml'

permissions:
  contents: read
concurrency:
  group: orion-botbot-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      META_LIVE_SEND: '0'
      QR_AI_ENABLED: '0'
      INBOX_SEND_ENABLED: '0'
      MARKETING_EXECUTION_ENABLED: '0'
      CAKTO_BILLING_LIVE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de teste
        run: python -m pip install -c requirements.lock '.[test]'
      - name: Compilar modulos de conversao e importacao
        run: |
          python -m compileall -q app/subscription_chatbot_botbot.py app/subscription_chatbot_botbot_preflight.py app/subscription_chatbot_archive_format.py app/subscription_chatbot_archive.py
      - name: Bateria com importacao, schemas, grafos e API
        run: |
          python -m pytest -q -ra \
            tests/unit/test_subscription_chatbot_botbot.py \
            tests/unit/test_subscription_chatbot_botbot_preflight.py \
            tests/unit/test_subscription_chatbot_archive_format.py \
            tests/unit/test_subscription_chatbot_archive.py \
            tests/unit/test_subscription_chatbot_api.py \
            tests/unit/test_subscription_chatbot_tags.py \
            tests/unit/test_subscription_chatbot_http.py
      - name: Isolamento de rede e ausencia de operacoes de producao
        run: |
          python -m pytest -q -ra tests/unit/test_subscription_chatbot_botbot_preflight.py tests/unit/test_subscription_chatbot_botbot.py

  frontend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Testes do importador, permissao e editor
        run: |
          node --check app/static/orion-subscription-chatbot.js
          node --test ui-tests/subscription-chatbot.test.mjs ui-tests/subscription-chatbot-card-actions.test.mjs ui-tests/subscription-workspace.test.mjs
