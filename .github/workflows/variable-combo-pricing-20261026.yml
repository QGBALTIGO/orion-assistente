name: Orion - combo a partir de (PostgreSQL e interface)

on:
  pull_request:
    branches: [main]
    paths:
      - 'alembic/versions/0034_variable_combo_pricing.py'
      - 'app/service_packages_api.py'
      - 'app/static/orion-suite.js'
      - 'tests/integration/test_variable_combo_pricing_pg.py'
      - 'tests/integration/combo_pre_migration_backfill.py'
      - 'tests/integration/test_variable_service_pricing.py'
      - 'tests/unit/test_variable_combo_release.py'
      - 'ui-tests/package-variable-combo.test.mjs'
      - 'scripts/apply_variable_combo_migration.py'
      - 'scripts/backup_and_migrate_combo_pricing.py'
      - 'scripts/backup_and_migrate_commissions.py'
      - 'scripts/prepare_vercel_orion.py'
      - '.github/workflows/variable-combo-pricing-20261026.yml'

permissions:
  contents: read

jobs:
  database:
    name: PostgreSQL 16 - combo minimo, agendamento e financeiro
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d barber_saas"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      SUPPORT_API_TOKEN: synthetic-combo-test-support-token-123456789
      REQUIRE_POSTGRES_TESTS: "1"
      BUSINESS_PROFILES_ENABLED: "1"
      ORION_DISPOSABLE_COMBO_CI: "1"
      ORION_EXPECTED_DATABASE_NAME: "barber_saas"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias e sintaxe Python
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
          python -m compileall -q app scripts alembic tests/integration/test_variable_combo_pricing_pg.py
      - name: Papéis e migração isolada 0034
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 \
            -v db_name=barber_saas \
            -v runtime_password=ci-runtime-only \
            -v migrator_password=ci-migrator-only \
            -v support_password=ci-support-only \
            -f infra/postgres/init/001-roles.sql
          alembic upgrade 0033_professional_commissions
          python tests/integration/combo_pre_migration_backfill.py seed
          alembic upgrade head
          python -m alembic current --check-heads
          python tests/integration/combo_pre_migration_backfill.py check
      - name: Combo variável, RLS, finanças, cotação e regressão
        run: |
          python -m pytest -q -ra \
            tests/unit/test_variable_combo_release.py \
            tests/unit/test_commission_release_backup.py \
            tests/integration/test_variable_combo_pricing_pg.py \
            tests/integration/test_variable_service_pricing.py \
            tests/integration/test_public_catalog.py \
            tests/integration/test_appointment_lifecycle.py

  mobile:
    name: Formulário mobile, prévia e preços
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências isoladas
        run: npm ci --prefix ui-tests --ignore-scripts --no-audit --no-fund
      - name: Testar modal, regras do combo e site público
        run: |
          node --check app/static/orion-suite.js
          node --test \
            ui-tests/package-variable-combo.test.mjs \
            ui-tests/services-compact.test.mjs \
            ui-tests/orion-public.test.mjs \
            ui-tests/agenda-lifecycle.test.mjs

  facade:
    name: Validar hash do painel Vercel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências travadas e contrato
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pytest -q -ra tests/test_vercel_orion_bundle.py tests/test_vercel_orion_routes.py
