name: Orion Entregas - fundacao de rotas (isolado)
on:
  push:
    branches: [codex/driver-routes-foundation-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barber_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d barber_saas" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-only@localhost:5432/barber_saas
      MIGRATION_DATABASE_URL: postgresql+psycopg://app_migrator:ci-migrator-only@localhost:5432/barber_saas
      SUPPORT_DATABASE_URL: postgresql+asyncpg://app_support:ci-support-only@localhost:5432/barber_saas
      REDIS_URL: redis://localhost:6379/15
      SUPPORT_API_TOKEN: synthetic-route-test-token-never-use-in-production
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias e banco descartavel
        env:
          PGPASSWORD: ci-postgres-only
        run: |
          python -m pip install -c requirements.lock ".[test]"
          python -m pip check
          psql -h localhost -U postgres -d barber_saas -v ON_ERROR_STOP=1 -v db_name=barber_saas -v runtime_password=ci-runtime-only -v migrator_password=ci-migrator-only -v support_password=ci-support-only -f infra/postgres/init/001-roles.sql
          alembic upgrade head
      - name: Sintaxe e contratos
        run: |
          python -m compileall -q app alembic/versions/0118_delivery_route_batches.py
          node --check app/static/orion-delivery-driver.js
      - name: Reservas, concorrencia, financeiro e regressao
        run: |
          pytest -q -ra tests/integration/test_delivery_route_batches_postgres.py tests/integration/test_delivery_logistics_postgres.py tests/integration/test_delivery_orders_postgres.py tests/integration/test_delivery_payments_postgres.py tests/integration/test_delivery_order_containers_postgres.py
