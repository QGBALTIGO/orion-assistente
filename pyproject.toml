[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-barbearias"
version = "0.8.0"
description = "Fundação multiempresa para agendamento de barbearias"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "uvloop==0.23.0; sys_platform == 'linux'",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "arq>=0.26,<1",
  "tzdata>=2025.2",
  "cryptography>=43,<50",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<1",
  "sniffio>=1.3.1,<2",
  "boto3>=1.35,<2",
  "Pillow>=11,<13",
  "pillow-heif>=0.21,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: precisa de PostgreSQL real e migrations aplicadas"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.svg", "static/*.css", "static/*.js", "static/*.woff2", "static/*-OFL.txt"]
