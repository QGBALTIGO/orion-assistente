# Candidate only. Do not install until the apex+www certificate exists and
# the application Origin/CSRF/client-IP contract has passed review.
# Loaded by the existing sites-enabled include inside the nginx http context.
map $http_upgrade $orionagenda_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name orionagenda.pro www.orionagenda.pro;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/orionagenda-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://orionagenda.pro$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.orionagenda.pro;
    ssl_certificate /etc/letsencrypt/live/orionagenda-ingress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionagenda-ingress/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log off;
    error_log /dev/null crit;
    return 308 https://orionagenda.pro$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orionagenda.pro;
    ssl_certificate /etc/letsencrypt/live/orionagenda-ingress/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orionagenda-ingress/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log off;
    error_log /dev/null crit;

    # Match the established Orion ingress upload allowance.
    client_max_body_size 16m;

    # The existing system resolver is active on this loopback address.
    # Resolve Railway repeatedly; never pin its current public IP.
    resolver 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $orionagenda_railway_target gftl16d0.up.railway.app;

    location ^~ /internal/ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location / {
        proxy_pass https://$orionagenda_railway_target$request_uri;
        proxy_http_version 1.1;

        # The provider hostname has a Railway-managed certificate, independent
        # of where the public apex DNS points. This combination was tested200.
        proxy_ssl_server_name on;
        proxy_ssl_name orion-assistente-production.up.railway.app;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        # Route through the provider's canonical Host and certificate. The
        # approved application middleware may restore its configured public
        # Host only when this ingress authentication token validates. The
        # browser's original Origin header is forwarded unchanged.
        proxy_set_header Host orion-assistente-production.up.railway.app;
        include /etc/nginx/snippets/orionagenda-origin-auth.conf;

        # Overwrite forwarding values received from untrusted clients.
        proxy_set_header X-Forwarded-Host orionagenda.pro;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $orionagenda_connection_upgrade;

        # Stream responses while buffering bounded request bodies before
        # sending them to the application; preserve existing upload limits.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        proxy_max_temp_file_size 0;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
