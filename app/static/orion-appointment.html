<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Meu agendamento · Orion</title><link rel="stylesheet" href="/appointment-assets/orion-appointment.css"><script defer src="/appointment-assets/orion-appointment.js"></script></head><body><main><header><img src="/brand/orion-brand-light.svg" alt="Orion" width="128"><button id="theme" type="button" aria-label="Alternar tema">Tema</button></header><section class="card" aria-labelledby="title"><p class="eyebrow" id="company">SEU AGENDAMENTO</p><h1 id="title">Vamos conferir seu horário</h1><p id="message" role="status" aria-live="polite">Carregando os detalhes com segurança…</p><dl id="details"></dl><div id="actions"></div><section id="reschedule" hidden><h2>Escolha um novo horário</h2><label for="day">Data do atendimento</label><input id="day" type="date"><button id="find-slots" type="button">Consultar horários</button><label for="slot">Horários disponíveis</label><select id="slot"><option value="">Selecione uma data</option></select><button id="confirm-reschedule" type="button" disabled>Confirmar remarcação</button></section><form id="review" hidden><h2>Como foi seu atendimento?</h2><fieldset><legend>Sua avaliação</legend><div class="stars" id="stars"></div></fieldset><label for="comment">Comentário (opcional)</label><textarea id="comment" maxlength="1000" rows="4"></textarea><button type="submit">Enviar avaliação</button></form><dialog id="confirmation"><form method="dialog"><h2>Cancelar agendamento?</h2><p>O horário será liberado na agenda. Esta ação não pode ser desfeita por esta página.</p><div class="dialog-actions"><button value="back" class="secondary">Voltar</button><button id="cancel-now" value="cancel" class="danger">Confirmar cancelamento</button></div></form></dialog></section><footer>Organizado com Orion Agenda</footer></main></body></html>
